function ipa(n){if(n<17)return IP[n];if(n===17)return 'dis.sɛt';if(n===18)return 'diz.ɥit';if(n===19)return 'diz.nœf';if(n<70){let d=n-n%10,r=n%10;return TI[d]+(r?(r===1?(d===20?'t.e.ɛ̃':'.e.ɛ̃'):(d===20?'t.':'.')+IP[r]):'')}if(n<80)return 'swasɑ̃t.'+(n===71?'e.ɔ̃z':ipa(n-60));if(n<100)return 'katʁə.vɛ̃'+(n===80?'':'.'+ipa(n-80));let h=Math.floor(n/100),r=n%100;return (h===1?'':(h===6?'si':IP[h])+'.')+'sɑ̃'+(r?'.'+ipa(r):'')}

function norm(s){return s.trim().toLowerCase().normalize('NFC').replace(/[‐‑–—]/g,'-').replace(/\s+/g,' ')}

function mechanism(n,a){let r=n%100,t=[];const s=tokens(a);if(s.includes('quatretorze'))t.push('14 的固定词形 quatorze（十四）：qua + torze，不是 quatre（四）再接 torze。');if(/quature|quarte/.test(s))t.push('quatre（四）的字母顺序是 q-u-a-t-r-e；中间没有额外的 u。');if(/trentre/.test(s))t.push('trente（三十）只有一个 r，在 t 后面；结尾是 -ente。');if(/toise/.test(s))t.push('trois（三）的顺序是 t-r-o-i-s；没有结尾 e。');if(/\bvingts\b/.test(s)&&r!==80)t.push('vingt（二十）通常不加 s；只有被乘且后面无数字的 quatre-vingts（八十）保留 s。');if(r===71)t.push('71 = 60 + 11：soixante et onze（七十一），必须有 et（和）。');if(r===81||r===91)t.push('81、91 不加 et（和）；后面仍有数字，vingt（二十）不加 s。');if(n>=100)t.push(n%100===0&&n>=200?'整百且被乘：cent（百）加 s；例如 deux cents（二百）。':'百位后面接数字：cent（百）不加 s；百位与余数之间不加 et（和），余数内部仍按其规则。');if(assess(n,a).form&&!assess(n,a).ok)t.push('词形和数量结构正确，只需规范空格/连字符；传统与 1990 全连字符写法都接受。');if(!t.length)t.push(r>=70?'先拆为 60 + 10…19 或 80 + 0…19，再检查词形和连接。':'对照每个词的字母顺序；固定词形与连接符分开检查。');return t.join(' ')}
const seedNums=[14,27,36,42,53,64,71,80,91,99],seedAns=['quatretorze','vingts sept','trentre six','quarante deux','cinquante toise','soixante quarte','soixante onze','quature vingts','quature vingts onze','quature vingts dix neuf'];
const seed=seedNums.map((n,i)=>({n,a:seedAns[i],...assess(n,seedAns[i]),legacyOK:n===42,mechanism:mechanism(n,seedAns[i]),type:'spell',cause:'未确认'}));
const KEY='peche-nombres-standalone-v1';let S={version:1,history:[{id:'import-round-1',mode:'spell',results:seed,note:'老公….你把这个数字单元按peche那样写一个页面给我，不要更新进我github，单独给我html文件。0到999的特别读法全部写进去。',imported:true}],wrong:{},learned:{},session:null};for(let r of seed)if(!r.legacyOK)S.wrong[r.n]={n:r.n,streak:0,errors:1};let storageOK=true;try{let old=localStorage.getItem(KEY);if(old){let o=JSON.parse(old);if(o.version===1&&Array.isArray(o.history)&&o.wrong&&o.learned)S=o}}catch(e){storageOK=false}

let page='phonics',tabMode='spell',voice=null,voices=[];function setupVoices(){if(!('speechSynthesis'in window)){ $('#voiceStatus').textContent='此浏览器不支持语音合成；播放不可用。';return}voices=speechSynthesis.getVoices().filter(v=>/^fr[-_]/i.test(v.lang));voice=voices.find(v=>v.lang==='fr-FR')||voices[0];$('#voiceStatus').textContent=voice?'法语语音：'+voice.name+' · 点击播放后朗读；音质取决于系统。':'未检测到法语音色：可尝试播放；若无声，请在系统安装法语语音后重新打开。'}

function sound(n){return `<button class="small" data-say="${n}" ${'speechSynthesis'in window?'':'disabled'} aria-label="播放数字 ${n} 的法语">▶ 播放</button> <button class="small" data-say="${n}" data-slow="1">慢速</button>`}

function start(mode){if(S.session){page='practice';render();toast('已恢复未完成的一轮；本轮题目固定。');return}let wrong=Object.values(S.wrong).filter(x=>x.streak<2).map(x=>x.n),nums;

else{nums=shuffle(wrong).slice(0,5);let special=shuffle([0,11,16,21,28,31,61,70,71,72,79,80,81,88,90,91,97,99,100,101,108,111,180,200,201,221,280,281,300,600,700,800,880,999]);while(nums.length<8&&special.length){let x=special.pop();if(!nums.includes(x))nums.push(x)}while(nums.length<10){let x=Math.floor(Math.random()*1000);if(!nums.includes(x))nums.push(x)}nums=shuffle(nums)}
if(!nums.length){toast('本组学习卡已完成，已改为混合练习。');return start('spell')}S.session={mode,nums,index:0,results:[],draft:'',note:'',feedback:null,started:Date.now()};page='practice';save();render()}
function render(){ $('#nav').innerHTML=[['phonics','字母组合'],['soundQuiz','发音抽考'],['practice','数字练习'],['rules','规则与发音'],['lookup','0–999 查询'],['records','错题与记录']].map(([id,label])=>`<button data-page="${id}" class="${page===id?'active':''}">${label}</button>`).join('');if(page==='phonics')phonics();if(page==='soundQuiz')soundQuiz();if(page==='practice')practice();if(page==='rules')rules();if(page==='lookup')lookup();if(page==='records')records();save()}
function practice(){let q=S.session;if(!q){$('#view').innerHTML=`<div class="card"><span class="badge">下一轮 · 错题 + 新题</span><h2 style="margin-top:15px">把声音、数字、拼写接起来。</h2><p>已导入第 1 轮原始成绩 <b>1/10</b>。按规范拼写重算 <b>0/10</b>，词形正确 <b>1/10</b>：42 缺连字符，另列为格式问题。</p><div class="grid"><button class="card" data-start="spell"><h3>拼写混合抽考</h3>每轮 10 题 · 先覆盖旧错题</button><button class="card" data-start="listen"><h3>听音写数字</h3>每轮 10 题 · 输入阿拉伯数字</button><button class="card" data-start="learn"><h3>先学一小组</h3>最多 12 张 · 答案揭晓后可撤销自评</button></div><p class="muted">错题需要跨题连续两次规范答对才标记稳定；每轮题数固定，不临时加题。学习卡自评不替代考试分数。</p></div>`;return}

${q.mode==='learn'?`<div class="center">${f?`<div class="word">${fr(n)}（${n}）</div><div class="ipa">/${ipa(n)}/</div>${sound(n)}<p>${esc(mechanism(n,''))}</p><button class="primary" id="remember">记住了</button> <button id="forgot">还不熟</button>`:`<p>先回忆法语词形和读音，再揭晓。</p><button class="primary" id="reveal">查看发音卡</button>`}</div>`:`<label for="answer">${q.mode==='listen'?'写数字，如 71':'写法语；接受传统写法与全连字符写法'}</label><input id="answer" class="answer" autocomplete="off" autocapitalize="none" spellcheck="false" value="${esc(q.draft)}" ${f?'disabled':''} inputmode="${q.mode==='listen'?'numeric':'text'}">${f?`<div class="feedback" role="status"><b class="${f.ok?'good':'bad'}">${f.ok?'正确':f.form?'词形正确 · 格式需修正':'需要修正'}</b><div class="word">${fr(n)}（${n}）</div><div class="ipa">/${ipa(n)}/</div>${sound(n)}<p>${esc(f.mechanism)}</p>${!f.ok?`<label>错因自述（可选，不自动认定为粗心）<select id="cause">${['未确认','知识缺口','粗心（自行确认）','听辨困难'].map(x=>`<option ${f.cause===x?'selected':''}>${x}</option>`).join('')}</select></label>`:''}</div><button class="primary" id="next">${q.index+1===q.nums.length?'本轮结果':'下一题'} · Enter</button>`:`<button class="primary" id="check">检查答案 · Enter</button>`}`}
<label for="note">自由输入 · 疑问、思路或想说的话</label><textarea id="note" placeholder="本轮一直保留，完成时与逐题结果一起记录、导出和复制。">${esc(q.note)}</textarea><p class="muted">可切换到规则页；当前题、输入和自由留言会保留。</p></div>`;if($('#answer')&&!f)$('#answer').focus()}
function check(){let q=S.session,a=$('#answer').value;if(!a.trim()){toast('先输入答案，或输入 ? 表示不会。');return}let n=q.nums[q.index],v=assess(n,a,q.mode);let r={n,a,...v,type:q.mode,cause:'未确认',mechanism:q.mode==='listen'?(v.ok?'听音与数字映射正确。':`目标是 ${n}；先分辨百位、60/80 组合，再恢复余数。`):mechanism(n,a)};q.feedback=r;q.results.push(r);if(!r.ok){let w=S.wrong[n]||{n,errors:0,streak:0};w.errors++;w.streak=0;S.wrong[n]=w}else if(q.mode==='spell'&&S.wrong[n])S.wrong[n].streak=Math.min(2,S.wrong[n].streak+1);save();practice()}

function summary(){let q=S.session;record();let count=q.results.filter(r=>r.ok).length;$('#view').innerHTML=`<div class="card"><span class="badge">本轮已记录</span><h2>${q.mode==='learn'?'学习卡完成':`规范正确 ${count} / ${q.results.length}`}</h2><p>错题号：${q.results.map((r,i)=>!r.ok?i+1:null).filter(Boolean).join('、')||'无'}。词形正确 ${q.results.filter(r=>r.form).length} 题。</p>${resultTable(q.results)}<h3>你的自由输入</h3><p style="white-space:pre-wrap">${esc(q.note||'（未填写）')}</p><div class="row"><button class="primary" id="continue">记录结果并继续混合抽考</button><button id="copy">复制本轮给对话</button><button id="undoLearn" ${q.mode==='learn'?'':'hidden'}>撤销最后一次学习判断</button></div><p class="muted">独立 HTML 无法自动把内容发进聊天；复制会同时包含逐题结果和自由留言。</p><textarea id="copyText" readonly hidden></textarea></div>`}

function records(){let rs=S.history[0].results;$('#view').innerHTML=`<div class="card"><h2>错题机制 · 不给你乱贴“粗心”标签</h2><p>当前待复现 <b>${Object.values(S.wrong).filter(x=>x.streak<2).length}</b> 个。两次规范拼写连续正确后标记稳定；听辨与学习自评不会抵消拼写错误。</p><div class="grid"><div><b>固定词形</b><p>quatorze（十四）、trente（三十）、trois（三）、quatre（四）需重建字母顺序；quatre（四）的错误在多题复现。</p></div><div><b>数量结构</b><p>71 必须有 et（和）；81/91 不加。80 后面接数字时去 s。</p></div><div><b>书面格式</b><p>42 的词形正确，缺连字符。旧成绩保留 1/10；规范拼写重算 0/10，单列格式错误。</p></div></div><div class="row"><button id="export">导出 JSON 备份</button><label style="margin:0"><span class="badge">导入备份</span><input type="file" id="import" accept="application/json" style="max-width:230px"></label></div><p class="muted">导入会合并历史和错题；保留当前正在进行的一轮。自由输入也包含在备份中。</p></div><div class="card"><h3>错题池</h3><div class="row">${Object.values(S.wrong).map(w=>`<span class="badge">${w.n} · ${w.streak>=2?'稳定 ✓':w.streak+'/2'} · 错 ${w.errors} 次</span>`).join('')}</div></div>${S.history.slice().reverse().map(h=>`<details class="card"><summary>${h.imported?'第 1 轮 · 导入原始 1/10':new Date(h.date).toLocaleString()} · ${h.mode} · 规范 ${h.results.filter(r=>r.ok).length}/${h.results.length}</summary>${resultTable(h.results)}<p style="white-space:pre-wrap">自由输入：${esc(h.note)}</p></details>`).join('')}`}
function lookup(n=71){$('#view').innerHTML=`<div class="card"><h2>0–999 · 任意数字发音卡</h2><div class="row"><label style="margin:0" for="number">输入数字</label><input id="number" type="number" min="0" max="999" value="${n}" style="width:130px"><button id="lookupGo">查询</button></div><div id="lookupCard"></div></div>`;lookupCard(n)}
function lookupCard(n){if(!Number.isInteger(n)||n<0||n>999){toast('请输入 0–999 的整数');return}$('#lookupCard').innerHTML=`<div class="big">${n}</div><div class="center"><div class="word">${fr(n)}（${n}）</div><div class="ipa">/${ipa(n)}/</div>${sound(n)}<p>1990 写法：${modern(n)}（${n}）</p></div><p>${esc(mechanism(n,''))}</p><p class="muted">音标按课堂三鼻化元音体系标注，un（一，阳性）统一为 /ɛ̃/；传统及部分地区 /œ̃/ 只作识别补充。音标是独立报数的教学宽式转写；句中读音见“规则与发音”。圆唇元音和鼻化元音不能靠中文谐音替代。</p>`}
const ex=ns=>`<div class="grid">${ns.map(n=>`<div class="feedback"><b>${fr(n)}（${n}）</b><div class="ipa">/${ipa(n)}/</div>${sound(n)}</div>`).join('')}</div>`;
function rules(){$('#view').innerHTML=`<div class="card"><h2>0–999 · 规则地图</h2><p>默认法国用法；独立报数、句中音变、百位规则分开学。每张卡可正常/慢速播放；使用系统法语 TTS，不是预录真人音频。</p>
<details open><summary>01 · 0–16 固定词形；17–19 用 10 + 个位</summary><div class="scroll"><table><tr><th>数字</th><th>词形与中文</th><th>独立读音</th><th>听音</th></tr>${Array.from({length:20},(_,n)=>`<tr><td>${n}</td><td>${fr(n)}（${n}）</td><td>/${ipa(n)}/</td><td>${sound(n)}</td></tr>`).join('')}</table></div><p>特别注意 quatorze（十四）不以 quatre（四）原样拼接；quinze（十五）/kɛ̃z/ 与 seize（十六）/sɛz/ 的元音不同。dix-sept（十七）/dis.sɛt/，dix-huit（十八）/diz.ɥit/，dix-neuf（十九）/diz.nœf/：后两者出现 /z/。</p></details>
<details><summary>02 · 20–69：整十词干 + 个位</summary>${ex([20,30,40,50,60])}<p>尾数 1：vingt et un（二十一）/vɛ̃t.e.ɛ̃/；其余直接接，如 trente-deux（三十二）。21、31、41、51、61 要有 et（和）。et（和）读 /e/，自身的 t 不发音，也不能与后面的 un（一）联诵。</p>${ex([21,28,61])}</details>
<details><summary>03 · 70–99：60 + 10…19；80 + 0…19</summary><p>70–79 = 60 + 10…19；71 专用 soixante et onze（七十一）。80 = 4 × 20；90–99 = 80 + 10…19。81、91 均没有 et（和）。</p>${ex([70,71,72,79,80,81,88,90,91,99])}<p>quatre-vingts（八十）结尾 s 静音；81–99 的 vingt（二十）没有 s，t 也不发音，别套用 21–29 的 /t/。</p></details>
<details><summary>04 · 100–999：百位、复数 s 与连接词</summary><p>100 是 cent（一百），不是 un cent（一百，非普通基数写法）。百位前加 2–9，余数按 0–99 规则读。百位后不直接加 et（和）：101 是 cent un（一百零一）；121 是 cent vingt et un（一百二十一），内部的 et（和）保留。</p><p>cent（百）只有“被乘且后面没有其他数词”时加 s：deux cents（二百）；deux cent un（二百零一）。180 的 cent（百）不加 s，vingts（二十的复数形式）加 s；280 同理，281 两处都不加。</p>${ex([100,101,108,111,121,180,200,201,221,280,281,600,800,999])}<p>cent un（一百零一）通常不把 t 读出；cent huit（一百零八）、cent onze（一百一十一）也不联出 t。six cents（六百）里 six（六）读 /si/；sept cents（七百）保留 /t/；neuf cents（九百）的 /f/ 通常保留，省略属较旧读法。</p></details>
<details><summary>05 · 拼写：空格、连字符、复数与阴性</summary><p>传统：vingt et un（二十一）、cent quatre-vingt-un（一百八十一）；1990：vingt-et-un（二十一）、cent-quatre-vingt-un（一百八十一）。本页接受两套规范，不接受随意混搭；词形正确但连接符错，会单列格式问题。</p><p>数字一般不变，例外是 un（一）修饰阴性名词时变 une（一，阴性），以及上述 vingt（二十）与 cent（百）的复数。vingt et une pages（二十一页）；quatre-vingt-une pages（八十一页），仍不加 et（和）。独立报数测试默认阳性 un（一）。</p><p>表示页码、编号等“第几个”时，即使是整百/80也不加 s：page quatre-vingt（第八十页）、page deux cent（第二百页）。本页考普通基数，不把编号规则混入评分。口语没有连字符声音；听不出 s 不等于写字时可以省略。</p></details>
<details><summary>06 · 鼻化元音与难发音：音标 → 口型 → 拼写</summary><div class="scroll"><table><tr><th>音</th><th>口型 / 舌位</th><th>例词（中文）</th></tr><tr><td>/ɛ̃/</td><td>口张开，嘴角略展，气流同时走鼻腔；不在后面加 n 或 ng。</td><td>vingt（二十）、cinq（五）、quinze（十五）</td></tr><tr><td>/ɑ̃/</td><td>口张大、舌位低，气流经过鼻腔。</td><td>trente（三十）、quarante（四十）、cent（百）</td></tr><tr><td>/ɔ̃/</td><td>嘴唇圆、口腔留空间，鼻化。</td><td>onze（十一）</td></tr><tr><td>/ɛ̃/（主教学）</td><td>un/um 在本页与 in/ain/ein 合流；传统及部分地区 /œ̃/ 仅作识别补充，不要求另练第四种口型。</td><td>un（一，阳性）/ɛ̃/</td></tr><tr><td>/ɥ/</td><td>先摆法语 /y/ 的圆唇口型，快速滑向 /i/。</td><td>huit（八）/ɥit/，不是英语 /w/。</td></tr><tr><td>/ø/、/œ/</td><td>舌在前、嘴唇圆；前者开口较小，后者较大。</td><td>deux（二）/dø/；neuf（九）/nœf/</td></tr><tr><td>/ʁ/</td><td>舌尖不卷，舌后部接近小舌处轻摩擦。</td><td>trois（三）/tʁwa/；quatre（四）/katʁ/</td></tr></table></div>${ex([15,16,20])}<p>拼写映射：oi 常读 /wa/，如 trois（三）；qu 常读 /k/，如 quatre（四）；eu 在 deux（二）读 /ø/，在 neuf（九）读 /œ/；x 在 soixante（六十）读 /s/。这些是本单元词形，不能推成法语所有词的无例外规律。</p></details>
<details><summary>07 · 句中音变：6、8、10 的三种位置</summary><p>独立数数：six（六）/sis/、dix（十）/dis/、huit（八）/ɥit/。修饰后面的辅音起始名词时常省尾辅音：six livres（六本书）/si livʁ/；dix personnes（十个人）/di pɛʁsɔn/；huit jours（八天）/ɥi ʒuʁ/。元音/哑音 h 前：six amis（六个朋友）/siz ami/；dix ans（十岁）/diz ɑ̃/；huit ans（八岁）/ɥit ɑ̃/。</p><p>cinq（五）的 /k/ 现代通常保留，某些辅音前也有省略变体。sept（七）的 p 静音、t 通常发音。neuf（九）的 f 通常读 /f/，在 neuf ans（九岁）、neuf heures（九点/九小时）中变 /v/；不能把所有元音前的 f 都改为 /v/。</p><div class="row"><button data-text="six livres">▶ six livres（六本书）</button><button data-text="six amis">▶ six amis（六个朋友）</button><button data-text="neuf ans">▶ neuf ans（九岁）</button></div></details>
<details><summary>08 · 联诵、禁联、20 与 80 的区别</summary><p>deux ans（两岁）/dø.zɑ̃/；trois euros（三欧元）/tʁwa.zøʁo/；vingt ans（二十岁）/vɛ̃.tɑ̃/；cent ans（一百岁）/sɑ̃.tɑ̃/。复数 quatre-vingts ans（八十岁）中的 s 联出 /z/；deux cents euros（二百欧元）同理。</p><p>21–29 的 vingt（二十）要读出 /t/，如 vingt-huit（二十八）/vɛ̃t.ɥit/；但 quatre-vingt-huit（八十八）/katʁə.vɛ̃.ɥit/ 不读 t。cent huit（一百零八）同样不联诵。onze（十一）、huit（八）前通常阻止联诵/省音，但 dix-huit（十八）、vingt-huit（二十八）等固定复合数有特殊连接。et（和）后不联诵。</p><p>某些法国东部口音单独说 vingt（二十）也读 /vɛ̃t/；quatre（四）的弱元音 /ə/ 可随语速出现或省略。页面 IPA 是教学宽式，TTS 与地区口音可能有细微差别。</p>${ex([20,28,88])}</details>
<details><summary>09 · 地区说法、日期与电话号码</summary><p>比利时/瑞士常见 septante（七十）、nonante（九十）；瑞士部分地区使用 huitante（八十），其他地区仍用 quatre-vingts（八十）。例如 septante et un（七十一）、huitante et un（八十一）、nonante et un（九十一）。本测试使用法国体系，地区用法本身并不是错。</p><p>电话通常分组读数；前导零要读出来，不能将 01 当普通整数 1。日期每月 1 号常用 premier（第一），不是普通基数 un（一）。这些属于应用场景，本页抽考只考 0–999 普通整数，不涉及小数或序数系统。</p></details>
<details><summary>参考来源与使用说明</summary><p>发音/拼写核对：<a href="https://vitrinelinguistique.oqlf.gouv.qc.ca/23141/la-prononciation/prononciation-des-nombres/prononciation-de-vingt" target="_blank" rel="noopener">OQLF：20 的读音</a> · <a href="https://vitrinelinguistique.oqlf.gouv.qc.ca/24631/la-prononciation/prononciation-des-nombres/prononciation-de-et-dans-les-nombres-composes" target="_blank" rel="noopener">连接词</a> · <a href="https://vitrinelinguistique.oqlf.gouv.qc.ca/23149/la-prononciation/prononciation-des-nombres/prononciation-de-huit" target="_blank" rel="noopener">8 的读音</a> · <a href="https://vitrinelinguistique.oqlf.gouv.qc.ca/21532/la-grammaire/les-determinants/determinants-numeraux/pluriel-de-vingt-de-cent-et-de-mille" target="_blank" rel="noopener">复数规则</a>。</p><p>页面不录音、不自动评判你的口头发音。播放由系统合成；听音练习需要设备具备法语语音。自由输入不是装饰：自动保存，连同逐题成绩进入历史、复制文本与 JSON 备份；不会自动发消息。</p></details></div>`}
function download(){let b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='Peche_Nombres_progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render()}else if(b.dataset.start)start(b.dataset.start);else if(b.dataset.say!==undefined)speak(fr(Number(b.dataset.say)),!!b.dataset.slow);else if(b.dataset.text)speak(b.dataset.text);else if(b.id==='check')check();else if(b.id==='next')next();else if(b.id==='reveal'){S.session.feedback={reveal:true};save();practice()}else if(b.id==='remember'||b.id==='forgot'){let q=S.session,n=q.nums[q.index],ok=b.id==='remember';let previous=S.learned[n]||0;q.results.push({n,a:ok?'自评认识':'自评不熟',ok,form:ok,type:'learn',cause:'自评',mechanism:'学习自评不等于拼写考试通过。',previous});if(ok)S.learned[n]=previous+1;q.index++;q.feedback=null;save();practice()}else if(b.id==='undoLearn'){let q=S.session,r=q.results.pop();if(!r)return;S.learned[r.n]=r.previous;q.index--;q.feedback=null;q.saved=false;S.history=S.history.filter(h=>h.id!=='round-'+q.started);save();practice()}else if(b.id==='continue'){S.session=null;start('spell')}else if(b.id==='copy')copyReport();else if(b.id==='export')download();else if(b.id==='lookupGo')lookupCard(Number($('#number').value))});
document.addEventListener('input',e=>{if(e.target.id==='answer'&&S.session){S.session.draft=e.target.value;save()}if(e.target.id==='note'&&S.session){S.session.note=e.target.value;save()}});
document.addEventListener('change',async e=>{if(e.target.id==='cause'){let q=S.session;q.feedback.cause=e.target.value;q.results.at(-1).cause=e.target.value;save()}if(e.target.id==='import'){try{let o=JSON.parse(await e.target.files[0].text());if(o.version!==1||!Array.isArray(o.history)||!o.wrong||!o.learned)throw Error('不支持的备份格式');for(let h of o.history){if(!h.id||!Array.isArray(h.results)||typeof h.note!=='string')throw Error('历史格式错误');for(let r of h.results)if(!Number.isInteger(r.n)||r.n<0||r.n>999||typeof r.a!=='string'||typeof r.mechanism!=='string')throw Error('答案格式错误')}for(let w of Object.values(o.wrong))if(!Number.isInteger(w.n)||w.n<0||w.n>999||!Number.isFinite(w.streak)||!Number.isFinite(w.errors))throw Error('错题格式错误');let ids=new Set(S.history.map(h=>h.id));S.history.push(...o.history.filter(h=>!ids.has(h.id)));for(let w of Object.values(o.wrong)){let a=S.wrong[w.n];S.wrong[w.n]=a?{n:w.n,errors:Math.max(a.errors,w.errors),streak:Math.min(a.streak,w.streak)}:w}for(let [n,v]of Object.entries(o.learned))if(/^\d+$/.test(n)&&Number(n)<=999&&Number.isFinite(v))S.learned[n]=Math.max(S.learned[n]||0,v);save();records();toast('备份已合并，当前练习保留。')}catch(err){toast('导入失败：'+err.message)}}});

function psave(){try{localStorage.setItem(PK,JSON.stringify(P))}catch(e){toast('发音记录保存失败，请复制结果备份。')}}
function clipPhonics(){const q=P.quiz;return '法语字母组合抽考 '+q.results.filter(x=>x.ok).length+'/'+q.results.length+'\n'+q.results.map((r,i)=>`${i+1}. ${r.title}；我的答案 /${r.answer}/；正确 /${r.correct}/；${r.ok?'正确':'错误'}；错因：${r.cause}；${r.rule}`).join('\n')+'\n自由输入：'+q.note}
function phonics(){const ids=PHONICS.map((d,i)=>i).filter(i=>(filter==='全部'||PHONICS[i].cat===filter)&&JSON.stringify(PHONICS[i]).toLowerCase().includes(search.toLowerCase()));$('#view').innerHTML=`<section class="card"><span class="badge">常见拼写地图 · ${PHONICS.length} 组</span><h2>先认组合，再读整词。</h2><p>按课堂采用的现代法国常见三鼻化元音体系整理：/ɑ̃/、/ɛ̃/、/ɔ̃/。传统及部分地区的 /œ̃/ 仅作补充识别，不单独抽考。覆盖常用组合、条件和重点例外；外来词、专名仍需查词典，不能保证每个新词都靠拼写唯一推音。</p><p><b>你最容易混的：</b>an/am/en/em → /ɑ̃/（张口）；on/om → /ɔ̃/（圆唇）；in/ain/ein → /ɛ̃/（舌前）；un/um → /ɛ̃/（与 in 组同音，拼写仍分别记忆）。</p><p>鼻化通常要求 n/m 在词尾或辅音前。<b>bonne（好的，阴性）</b> /bɔn/、<b>une（一，阴性）</b> /yn/ 不鼻化。鼻音不是在元音后面再加 n/ng。</p><div class="row">${['全部',...new Set(PHONICS.map(d=>d.cat))].map(c=>`<button data-phcat="${c}" class="${filter===c?'active':''}">${c}</button>`).join('')}</div><label for="phSearch">搜索拼写、音标、例词或中文</label><input id="phSearch" value="${esc(search)}" placeholder="如 on、鼻化、/y/、月亮" style="width:100%"><p>已自评熟悉 <span id="phKnownCount">${P.known.length}</span>/${PHONICS.length} · 当前 ${ids.length} 组（自评不等于发音测评）</p><progress id="phKnownProgress" value="${P.known.length}" max="${PHONICS.length}"></progress><button class="primary" id="phStart">开始 10 题抽考</button></section><div class="grid">${ids.map(i=>{let d=PHONICS[i];return `<article class="card"><span class="badge">${d.cat} · ${i+1}</span><h3>${esc(d.title)}（拼写组合）</h3><div class="ipa">/${d.ipa}/</div><p><b>口型：</b>${d.mouth}</p><p><b>规则与例外：</b>${d.rule}</p>${d.ex.map(e=>`<div class="feedback"><b>${esc(e.w)}（${e.zh}）</b><div class="ipa">/${e.ipa}/</div><button class="small" data-text="${esc(e.w)}">▶ 法语播放</button> <button class="small" data-phslow="${esc(e.w)}">慢速</button></div>`).join('')}<button data-phknown="${i}" aria-pressed="${P.known.includes(i)}">${P.known.includes(i)?'✓ 已熟悉 · 点击撤销':'标记熟悉'}</button></article>`}).join('')}</div><section class="card"><h3>播放说明与参考</h3><p>按钮实际调用设备法语 TTS，朗读例词，不把字母名当成组合的声音；不是预录真人。系统没有法语音色时可能无法播放，页面底部会提示。慢速只改变语速，不替代自然语流。</p><p>抽考检测拼写与音标的映射，不自动评分你的口头发音。结果、错误池和自由留言保存在此浏览器；与数字练习分别记录。旧历史保留当时的音标，当前抽考统一使用新标准。</p><a href="https://www.lawlessfrench.com/pronunciation/" target="_blank" rel="noopener">Lawless French 发音索引</a> · <a href="https://www.lawlessfrench.com/pronunciation/ti/" target="_blank" rel="noopener">ti 组合详解</a> · <a href="https://linguawire.com/foundations/french/pronunciation/nasals" target="_blank" rel="noopener">鼻化元音与拼写条件</a></section>`}
function phStart(){if(!P.quiz||P.quiz.done){let pool=[...new Set([...P.wrong,...shuffle(PHONICS.map((_,i)=>i))])].slice(0,10);P.quiz={ids:pool,index:0,results:[],note:'',checked:false,done:false}}page='soundQuiz';psave();render()}
function soundQuiz(){let q=P.quiz;if(!q){$('#view').innerHTML='<div class="card"><h2>拼写 → 读音 · 10 题</h2><p>用完整例词确认读音，避免把一组有多种读法的字母强行判成一个音。优先复现旧错题。</p><button id="phStart" class="primary">开始抽考</button></div>';return}if(q.index>=q.ids.length){if(!q.done){q.done=true;P.history.push({date:new Date().toISOString(),results:q.results,note:q.note});psave()}$('#view').innerHTML=`<div class="card"><h2>答对 ${q.results.filter(r=>r.ok).length}/${q.results.length}</h2><p>错误题号：${q.results.flatMap((r,i)=>r.ok?[]:[i+1]).join('、')||'无'}</p><div class="scroll"><table><tr><th>题号与例词</th><th>你的答案 → 正确答案</th><th>机制与错因</th></tr>${q.results.map((r,i)=>`<tr><td>${i+1} · ${esc(r.title)}</td><td>/${esc(r.answer)}/ → /${r.correct}/</td><td>${r.rule}<br>错因：${esc(r.cause)}</td></tr>`).join('')}</table></div><p style="white-space:pre-wrap">自由输入：${esc(q.note||'未填写')}</p><button id="phContinue" class="primary">记录结果并继续</button> <button id="phCopy">复制结果与留言给对话</button><textarea id="phReport" readonly>${esc(clipPhonics())}</textarea><p class="muted">网页无法自动写入聊天，复制内容包含逐题结果和你的留言。</p></div>`;return}
let d=PHONICS[q.ids[q.index]],e=d.ex[0];if(!q.options){q.options=shuffle([...new Set([e.ipa,...shuffle(PHONICS.filter(x=>x.ex[0].ipa!==e.ipa)).slice(0,3).map(x=>x.ex[0].ipa)])]);psave()}let r=q.results.at(-1);$('#view').innerHTML=`<div class="card"><div class="row between"><span class="badge">${d.cat} · ${esc(d.title)}（目标拼写）</span><span>${q.index+1}/${q.ids.length}</span></div><progress value="${q.index}" max="${q.ids.length}"></progress><h2 class="word">${esc(e.w)}（${e.zh}）</h2><p>这个例词的完整读音是哪一个？提交后可播放核对。</p><fieldset style="border:0;padding:0"><legend>选择音标</legend><div class="choices">${q.options.map((v,i)=>`<label class="feedback" style="margin:0"><input type="radio" name="phAnswer" value="${i}" ${q.checked?'disabled':''} ${q.selected===i?'checked':''}> /${v}/</label>`).join('')}</div></fieldset>${q.checked?`<div class="feedback" role="status"><b class="${r.ok?'good':'bad'}">${r.ok?'正确':'需要修正'}</b><p>你的答案 /${esc(r.answer)}/ → 正确 /${e.ipa}/</p><p>${d.mouth} ${d.rule}</p><button data-text="${esc(e.w)}">▶ ${esc(e.w)}（${e.zh}）</button>${r.ok?'':`<label>错因（默认未确认）<select id="phCause">${['未确认','知识缺口','粗心（自行确认）','听辨困难'].map(v=>`<option ${v===r.cause?'selected':''}>${v}</option>`).join('')}</select></label>`}</div><button id="phNext" class="primary">${q.index+1===q.ids.length?'查看本轮结果':'下一题'}</button>`:'<button id="phCheck" class="primary" style="margin-top:16px">提交答案</button>'}<label for="phNote">自由输入 · 疑问、思路或想说的话</label><textarea id="phNote">${esc(q.note)}</textarea><p class="muted">输入自动保留；与本轮逐题结果一起记录和复制。</p></div>`}
document.addEventListener('click',async e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.phcat){filter=b.dataset.phcat;phonics()}if(b.dataset.phslow)speak(b.dataset.phslow,true);if(b.dataset.phknown!==undefined){let i=+b.dataset.phknown;P.known=P.known.includes(i)?P.known.filter(x=>x!==i):[...P.known,i];psave();b.textContent=P.known.includes(i)?'✓ 已熟悉 · 点击撤销':'标记熟悉';b.setAttribute('aria-pressed',P.known.includes(i));$('#phKnownCount').textContent=P.known.length;$('#phKnownProgress').value=P.known.length;}if(b.id==='phStart')phStart();if(b.id==='phCheck'){let a=document.querySelector('input[name="phAnswer"]:checked');if(!a){toast('先选择一个音标。');return}let q=P.quiz,id=q.ids[q.index],d=PHONICS[id],ex=d.ex[0],answer=q.options[+a.value],ok=answer===ex.ipa;q.selected=+a.value;q.results.push({title:ex.w+'（'+ex.zh+'）',answer,correct:ex.ipa,ok,rule:d.rule,cause:'未确认'});q.checked=true;P.wrong=ok?P.wrong.filter(x=>x!==id):[...new Set([...P.wrong,id])];psave();soundQuiz()}if(b.id==='phNext'){let q=P.quiz;q.index++;q.checked=false;delete q.options;delete q.selected;psave();soundQuiz()}if(b.id==='phContinue'){P.quiz=null;phStart()}if(b.id==='phCopy'){try{await navigator.clipboard.writeText(clipPhonics());toast('已复制结果和自由留言。')}catch(e){$('#phReport').focus();$('#phReport').select();toast('请长按文本框复制。')}}});
document.addEventListener('input',e=>{if(e.target.id==='phSearch'){search=e.target.value;let pos=e.target.selectionStart;phonics();$('#phSearch').focus();$('#phSearch').setSelectionRange(pos,pos)}if(e.target.id==='phNote'){P.quiz.note=e.target.value;psave()}});
document.addEventListener('change',e=>{if(e.target.id==='phCause'){P.quiz.results.at(-1).cause=e.target.value;psave()}});

render();setupVoices();if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=setupVoices;
</script></html>

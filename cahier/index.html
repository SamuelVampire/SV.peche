<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cahier · French Practice</title><style>
:root{--ink:#242424;--mut:#89817f;--line:#e9e1dd;--accent:#ed7d49}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% 80%,#f5cac7 0,transparent 60%),#f8f3f0;color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}main{max-width:960px;margin:auto;padding:32px 22px 80px}header{text-align:center;padding:58px 0 35px}h1{font-size:clamp(48px,8vw,78px);letter-spacing:-.055em;line-height:1.1;margin:0;font-weight:750}h2{font-size:26px;margin:0 0 12px}h3{font-size:18px;margin:0 0 8px}p{margin:8px 0 16px}.mut{color:var(--mut);font-size:14px}.tabs,.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.tabs{justify-content:center;margin:0 0 28px}button,select,input,textarea{font:inherit;border:1px solid var(--line);border-radius:13px;padding:11px 14px;background:#fff;color:var(--ink)}button{cursor:pointer}button.active,button.primary{background:#252525;color:white;border-color:#252525}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.tile,.card{background:#ffffffcc;border-radius:20px;padding:24px;border:1px solid #ffffffa0}.tile{text-align:left;min-height:124px}.tile strong{display:block;font-size:22px}.tile small{color:var(--accent)}.card{margin:16px 0}.between{justify-content:space-between}.big{font-size:clamp(34px,7vw,58px);text-align:center;margin:34px 0}.answer{width:100%;font-size:22px}.hidden{display:none}textarea{width:100%;min-height:90px;resize:vertical}label{display:block;margin:14px 0 6px}.good{color:#26704c}.bad{color:#a9473c}table{border-collapse:collapse;width:100%}td,th{padding:9px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mut);font-weight:500}.scroll{overflow:auto}details{padding:12px 0;border-bottom:1px solid var(--line)}summary{cursor:pointer;font-weight:600}progress{width:100%;accent-color:var(--accent)}.pill{font-size:13px;background:#f5eae5;padding:4px 10px;border-radius:20px}.note{background:#f8f2ee;padding:15px;border-radius:14px;margin:14px 0}button:focus-visible,input:focus-visible{outline:3px solid #e8b9a4;outline-offset:2px}@media(max-width:600px){main{padding:18px 14px 60px}header{padding:40px 0 28px}.card,.tile{padding:19px}}
</style></head><body><main><header><h1>Cahier</h1><p class="mut">French practice · 你的法语练习册</p></header><nav class="tabs" id="tabs"></nav><div id="app"></div><p class="mut" id="voice"></p></main><script>
const G=[["规则 -er","parler","说话","parle,parles,parle,parlons,parlez,parlent","去掉 -er，加 -e/-es/-e/-ons/-ez/-ent；aller 是第三组。"],["-ger / -cer","manger","吃","mange,manges,mange,mangeons,mangez,mangent","nous 的 -geons 保留 /ʒ/；commencer → nous commençons，ç 保留 /s/。"],["词干变化 -er","appeler","打电话","appelle,appelles,appelle,appelons,appelez,appellent","je/tu/il/ils 常改变词干；préférer → préfère，acheter → achète；payer → paie/paye。"],["规则第二组 -ir","finir","完成","finis,finis,finit,finissons,finissez,finissent","判断标志是 nous -issons、现在分词 -issant；partir 不属于第二组。"],["短词干 -ir","partir","离开","pars,pars,part,partons,partez,partent","partir/sortir/dormir：单数短词干，复数长词干；courir、mourir 不套此规则。"],["第三组 -er 式词尾","ouvrir","打开","ouvre,ouvres,ouvre,ouvrons,ouvrez,ouvrent","ouvrir/offrir/cueillir 的现在时词尾像 -er，但过去分词不一定相同：ouvert。"],["vendre 类 -re","vendre","卖","vends,vends,vend,vendons,vendez,vendent","词干保留 d；-s/-s/无附加词尾/-ons/-ez/-ent；prendre、mettre 另算。"],["prendre 家族","prendre","拿","prends,prends,prend,prenons,prenez,prennent","三套词干 prend-/pren-/prenn-；apprendre、comprendre 同族。"],["mettre 家族","mettre","放置","mets,mets,met,mettons,mettez,mettent","单数 met-，复数 mett-；permettre、promettre 同族。"],["venir / tenir","venir","来","viens,viens,vient,venons,venez,viennent","三套词干 vien-/ven-/vienn-；tenir → tiens/tenons/tiennent。"],["-oir 与特殊家族","pouvoir","能够","peux,peux,peut,pouvons,pouvez,peuvent","不能用一张 -oir 词尾表；vouloir、devoir、voir、savoir、recevoir 各有模式。"],["四个高频特殊动词","être","是","suis,es,est,sommes,êtes,sont","être、avoir、aller、faire 必须完整记忆；être 和 avoir 还用于复合时态。"]],X=[["avoir","有","ai,as,a,avons,avez,ont"],["aller","去","vais,vas,va,allons,allez,vont"],["faire","做","fais,fais,fait,faisons,faites,font"],["commencer","开始","commence,commences,commence,commençons,commencez,commencent"],["préférer","更喜欢","préfère,préfères,préfère,préférons,préférez,préfèrent"],["acheter","购买","achète,achètes,achète,achetons,achetez,achètent"],["choisir","选择","choisis,choisis,choisit,choisissons,choisissez,choisissent"],["sortir","出去","sors,sors,sort,sortons,sortez,sortent"],["dormir","睡觉","dors,dors,dort,dormons,dormez,dorment"],["offrir","赠送","offre,offres,offre,offrons,offrez,offrent"],["attendre","等待","attends,attends,attend,attendons,attendez,attendent"],["comprendre","理解","comprends,comprends,comprend,comprenons,comprenez,comprennent"],["permettre","允许","permets,permets,permet,permettons,permettez,permettent"],["tenir","拿住","tiens,tiens,tient,tenons,tenez,tiennent"],["vouloir","想要","veux,veux,veut,voulons,voulez,veulent"],["devoir","必须","dois,dois,doit,devons,devez,doivent"],["voir","看见","vois,vois,voit,voyons,voyez,voient"],["savoir","知道","sais,sais,sait,savons,savez,savent"],["recevoir","收到","reçois,reçois,reçoit,recevons,recevez,reçoivent"],["dire","说","dis,dis,dit,disons,dites,disent"],["lire","阅读","lis,lis,lit,lisons,lisez,lisent"],["écrire","写","écris,écris,écrit,écrivons,écrivez,écrivent"],["boire","喝","bois,bois,boit,buvons,buvez,boivent"]],P=['je','tu','il / elle / on','nous','vous','ils / elles'];
const V=[...G.map((g,i)=>({name:g[1],zh:g[2],forms:g[3].split(','),group:i})),...X.map(x=>({name:x[0],zh:x[1],forms:x[2].split(','),group:-1}))];
const KEY='cahier-french-v1';let db={history:[],wrong:{},done:{},notes:''};try{db={...db,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}let tab='home',selected=0,quiz=null;
const el=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
function speak(s){if(!('speechSynthesis'in window)){el('voice').textContent='当前浏览器不支持语音播放。';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='fr-FR';u.rate=.82;let vs=speechSynthesis.getVoices().filter(x=>x.lang.toLowerCase().startsWith('fr'));if(vs.length)u.voice=vs.find(x=>x.lang==='fr-FR')||vs[0];u.onerror=()=>el('voice').textContent='法语语音播放失败，请检查系统法语语音包。';speechSynthesis.speak(u)}
function go(t){tab=t;render()}function render(){el('tabs').innerHTML=tab==='home'?'':'<button data-go="home">← Home</button>';el('app').innerHTML=tab==='home'?home():tab==='sounds'?sounds():tab==='numbers'?numbers():tab==='verbs'?verbs():practice();bind()}
function home(){return '<div class="grid">'+[['sounds','Sounds','音标 · 字母组合'],['numbers','Numbers','数字 0–999'],['verbs','Verbs','现在时 12 类 · 其他时态'],['practice','Practice','混合练习 · 错题']].map(([id,t,sub])=>'<button class="tile" data-go="'+id+'"><strong>'+t+'</strong><span class="mut">'+sub+'</span></button>').join('')+'</div><p class="mut" style="text-align:center;margin-top:25px">进度保存在当前浏览器 · 不影响 Pêche 本体</p>'}
const PH=[['/i/','i, î, ï','si（如果）、île（岛）'],['/y/','u, û','tu（你）、lune（月亮）'],['/u/','ou, où','vous（您／你们）、où（哪里）'],['/e/','é, -er, -ez','été（夏天）、parler（说话）'],['/ɛ/','è, ê, ai, ei','mère（母亲）、lait（牛奶）'],['/ø/','eu, œu','deux（二）'],['/œ/','eu, œu','sœur（姐妹）'],['/ɑ̃/','an, en, am, em','sans（没有）、enfant（孩子）'],['/ɛ̃/','in, ain, ein, im','vin（葡萄酒）、pain（面包）'],['/ɔ̃/','on, om','bon（好的）、nom（名字）'],['/ʒ/','j, ge','je（我）、manger（吃）'],['/ʃ/','ch','chat（猫）'],['/ɲ/','gn','montagne（山）'],['/wa/','oi','moi（我）'],['/ɥi/','ui','huit（八）']];
function sounds(){return '<div class="card"><h2>Sounds</h2><p class="mut">点例词播放法语；IPA 是近似标准读法，实际口音存在差异。法语元音与拼写不是一对一。</p><div class="grid">'+PH.map(x=>'<div class="tile"><h3>'+x[0]+'</h3><div class="mut">'+x[1]+'</div><p>'+x[2]+'</p><button data-say="'+x[2].split('（')[0]+'">▶ 播放</button></div>').join('')+'</div><details><summary>重音符号与特殊字母</summary><p>accent aigu（尖音符）é；accent grave（钝音符）è、à、ù；accent circonflexe（长音符）â、ê、î、ô、û；tréma（分音符）ë、ï、ü、ÿ；cédille（软音符）ç。它们不一定都改变读音。</p></details></div>'}
function number(n){let u=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize'];if(n<17)return u[n];if(n<20)return 'dix-'+u[n-10];let t={20:'vingt',30:'trente',40:'quarante',50:'cinquante',60:'soixante'};if(n<70){let d=n-n%10,r=n%10;return t[d]+(r?(r===1?' et un':'-'+u[r]):'')}if(n<80)return n===71?'soixante et onze':'soixante-'+number(n-60);if(n<100)return n===80?'quatre-vingts':'quatre-vingt-'+number(n-80);let h=Math.floor(n/100),r=n%100;return(h===1?'cent':u[h]+' cent'+(r?'':'s'))+(r?' '+number(r):'')}
function numbers(){return '<div class="card"><h2>Numbers</h2><p>0–999 · 法语数字查询与听写</p><div class="row"><input id="num" type="number" min="0" max="999" value="71"><button id="numgo" class="primary">查看</button></div><div id="numresult"></div><div class="row"><button id="numquiz">数字听写 · 10题</button></div><p class="mut">70 = 60 + 10；80 = 4 × 20；90 = 4 × 20 + 10。注意 71 的 et、80 的 s，以及 81 不用 et。</p></div>'}
function numshow(){let n=Number(el('num').value);if(!Number.isInteger(n)||n<0||n>999){el('numresult').textContent='请输入 0–999 的整数';return}el('numresult').innerHTML='<div class="big">'+n+'</div><h2 style="text-align:center">'+number(n)+'</h2><p style="text-align:center"><button data-say="'+number(n)+'">▶ 法语发音</button></p>'}
function verbs(){let g=G[selected],v=V[selected];return '<div class="card"><h2>Verbs</h2><p class="mut">官方只有 3 个动词组；下面 12 类是教学分类，不是官方分组。</p><label>现在时变位家族</label><select id="group">'+G.map((x,i)=>'<option value="'+i+'" '+(i===selected?'selected':'')+'>'+(i+1)+'. '+x[0]+'</option>').join('')+'</select><div class="note"><h3>'+g[1]+'（'+g[2]+'）</h3><p>'+g[4]+'</p><button data-say="'+g[1]+'">▶ 原形发音</button></div><div class="scroll"><table><thead><tr><th>人称</th><th>Présent（现在时）</th><th></th></tr></thead><tbody>'+P.map((p,i)=>'<tr><td>'+p+'</td><td><b>'+v.forms[i]+'</b></td><td><button data-say="'+p.split(' /')[0]+' '+v.forms[i]+'">▶</button></td></tr>').join('')+'</tbody></table></div><p><button class="primary" id="groupquiz">练习这一类</button></p><details><summary>同类与高频特殊动词参考表</summary><div class="scroll"><table>'+V.filter(x=>x.group===-1).map(x=>'<tr><td>'+x.name+'（'+x.zh+'）</td><td>'+x.forms.join(' / ')+'</td></tr>').join('')+'</table></div></details></div><div class="card"><h2>其他时态 · 构造地图</h2>'+[['Imparfait（未完成过去时）','nous 现在时词干去 -ons + -ais/-ais/-ait/-ions/-iez/-aient；être → ét-。'],['Passé composé（复合过去时）','avoir/être 现在时 + 过去分词；部分动词需性数配合。'],['Futur simple（简单将来时）','未来词干 + -ai/-as/-a/-ons/-ez/-ont；être → ser-、avoir → aur-、aller → ir-。'],['Conditionnel présent（条件式现在时）','未来词干 + 未完成过去时词尾。'],['Subjonctif présent（虚拟式现在时）','常用 ils/nous 两套现在时词干；être/avoir/aller 等有特殊形式。'],['Impératif（命令式）','主要用 tu/nous/vous；部分 -er 的 tu 形式去 s，vas-y（去吧）例外。'],['Futur proche（近将来）','aller 现在时 + 动词原形。'],['Passé récent（最近过去）','venir de + 动词原形。']].map(x=>'<details><summary>'+x[0]+'</summary><p>'+x[1]+'</p></details>').join('')+'</div>'}
function start(kind){let pool=kind==='group'?V.filter(x=>x.group===selected):V;let questions=Array.from({length:10},()=>{let v=pool[Math.floor(Math.random()*pool.length)],p=Math.floor(Math.random()*6);return{v:v.name,zh:v.zh,p,answer:v.forms[p],kind}});if(kind==='number')questions=Array.from({length:10},()=>{let n=Math.floor(Math.random()*1000);return{v:String(n),zh:'',p:0,answer:String(n),kind}});if(kind==='wrong'){let keys=Object.keys(db.wrong);questions=keys.length?keys.slice(0,10).map(k=>{let [v,p]=k.split('|'),item=V.find(x=>x.name===v);return{v,p:+p,zh:item.zh,answer:item.forms[+p],kind}}):questions}quiz={questions,i:0,results:[],feedback:null,note:''};go('practice')}
function practice(){if(!quiz)return '<div class="card"><h2>Practice</h2><p class="mut">逐题作答、查看解析、记录错题；每轮 10 题。</p><div class="grid"><button class="tile" id="mix"><strong>Mixed</strong><span class="mut">所有动词 · 六人称混合</span></button><button class="tile" id="wrong"><strong>Review</strong><span class="mut">复现错题</span></button></div><p class="mut">已完成 '+db.history.length+' 轮 · 待复习 '+Object.keys(db.wrong).length+' 项</p></div>';if(quiz.i>=quiz.questions.length)return summary();let q=quiz.questions[quiz.i],f=quiz.feedback;return '<div class="card"><div class="row between"><span class="pill">'+(q.kind==='number'?'数字听写':'Présent · 现在时')+'</span><span class="mut">'+(quiz.i+1)+' / '+quiz.questions.length+'</span></div><progress max="'+quiz.questions.length+'" value="'+quiz.i+'"></progress><div class="big">'+(q.kind==='number'?'♫':q.v+'（'+q.zh+'）')+'</div><p style="text-align:center">'+(q.kind==='number'?'<button data-say="'+number(Number(q.v))+'">▶ 听数字</button>':P[q.p]+' <button data-say="'+P[q.p].split(' /')[0]+' '+q.answer+'">▶</button>')+'</p><label>输入'+(q.kind==='number'?'阿拉伯数字':'正确变位')+'</label><input class="answer" id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" '+(f?'disabled':'')+' placeholder="在这里输入" value="'+esc(f?.user||'')+'">'+(f?'<div class="note"><b class="'+(f.ok?'good':'bad')+'">'+(f.ok?'正确':'需要修正')+'</b><p>你的答案：'+esc(f.user)+'<br>正确答案：<b>'+esc(q.answer)+'</b></p><p>'+esc(f.why)+'</p></div><button id="next" class="primary">'+(quiz.i===quiz.questions.length-1?'查看结果':'下一题')+' ↵</button>':'<button id="check" class="primary">提交答案 ↵</button>')+'<label>自由输入 · 疑问 / 思路 / 其他想说的</label><textarea id="note" placeholder="记录后会随本轮结果保存">'+esc(quiz.note)+'</textarea></div>'}
function check(){let q=quiz.questions[quiz.i],user=el('answer').value.trim();if(!user)return;let ok=user.normalize('NFC').toLowerCase()===q.answer.normalize('NFC').toLowerCase();let why=q.kind==='number'?'数字听辨：正确的数字是 '+q.answer+'。':'主语 '+P[q.p]+' 决定人称，动词 '+q.v+' 的这一格是 '+q.answer+'。'+(G.find(g=>g[1]===q.v)?.[4]||'这是该动词的特殊变位，需要按词干与词尾记忆。');quiz.feedback={user,ok,why};quiz.results.push({...q,user,ok,why});if(!ok&&q.kind!=='number')db.wrong[q.v+'|'+q.p]=true;else if(ok)delete db.wrong[q.v+'|'+q.p];render()}
function summary(){let score=quiz.results.filter(x=>x.ok).length;return '<div class="card"><h2>本轮结果 · '+score+'/'+quiz.questions.length+'</h2><p>错误题号：'+(quiz.results.map((x,i)=>x.ok?'':i+1).filter(Boolean).join('、')||'无')+'</p>'+quiz.results.map((x,i)=>'<details><summary>'+(i+1)+'. '+(x.ok?'✓':'✗')+' '+x.v+'</summary><p>你的答案：'+esc(x.user)+'；正确答案：'+esc(x.answer)+'</p><p>'+esc(x.why)+'</p></details>').join('')+'<label>自由输入</label><textarea id="note">'+esc(quiz.note)+'</textarea><p><button class="primary" id="finish">记录结果并继续</button></p></div>'}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));if(el('numgo')){el('numgo').onclick=numshow;numshow()}if(el('numquiz'))el('numquiz').onclick=()=>start('number');if(el('group'))el('group').onchange=e=>{selected=+e.target.value;render()};if(el('groupquiz'))el('groupquiz').onclick=()=>start('group');if(el('mix'))el('mix').onclick=()=>start('mix');if(el('wrong'))el('wrong').onclick=()=>start('wrong');if(el('note'))el('note').oninput=e=>quiz.note=e.target.value;if(el('check'))el('check').onclick=check;if(el('next'))el('next').onclick=()=>{quiz.i++;quiz.feedback=null;render()};if(el('finish'))el('finish').onclick=()=>{db.history.push({date:new Date().toISOString(),results:quiz.results,note:quiz.note});save();quiz=null;render()};if(el('answer'))el('answer').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();if(quiz.feedback){quiz.i++;quiz.feedback=null;render()}else check()}}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b)speak(b.dataset.say)});
render();
</script></body></html>

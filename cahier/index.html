tons,sortez,sortent"],["dormir","睡觉","dors,dors,dort,dormons,dormez,dorment"],["offrir","赠送","offre,offres,offre,offrons,offrez,offrent"],["attendre","等待","attends,attends,attend,attendons,attendez,attendent"],["comprendre","理解","comprends,comprends,comprend,comprenons,comprenez,comprennent"],["permettre","允许","permets,permets,permet,permettons,permettez,permettent"],["tenir","拿住","tiens,tiens,tient,tenons,tenez,tiennent"],["vouloir","想要","veux,veux,veut,voulons,voulez,veulent"],["devoir","必须","dois,dois,doit,devons,devez,doivent"],["voir","看见","vois,vois,voit,voyons,voyez,voient"],["savoir","知道","sais,sais,sait,savons,savez,savent"],["recevoir","收到","reçois,reçois,reçoit,recevons,recevez,reçoivent"],["dire","说","dis,dis,dit,disons,dites,disent"],["lire","阅读","lis,lis,lit,lisons,lisez,lisent"],["écrire","写","écris,écris,écrit,écrivons,écrivez,écrivent"],["boire","喝","bois,bois,boit,buvons,buvez,boivent"]],P=['je','tu','il / elle / on','nous','vous','ils / elles'];

function sounds(){return '<div class="card"><h2>Sounds</h2><p class="mut">点例词播放法语；IPA 是近似标准读法，实际口音存在差异。法语元音与拼写不是一对一。</p><div class="grid">'+PH.map(x=>'<div class="tile"><h3>'+x[0]+'</h3><div class="mut">'+x[1]+'</div><p>'+x[2]+'</p><button data-say="'+x[2].split('（')[0]+'">▶ 播放</button></div>').join('')+'</div><details><summary>重音符号与特殊字母</summary><p>accent aigu（尖音符）é；accent grave（钝音符）è、à、ù；accent circonflexe（长音符）â、ê、î、ô、û；tréma（分音符）ë、ï、ü、ÿ；cédille（软音符）ç。它们不一定都改变读音。</p></details></div>'}
function number(n){let u=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize'];if(n<17)return u[n];if(n<20)return 'dix-'+u[n-10];let t={20:'vingt',30:'trente',40:'quarante',50:'cinquante',60:'soixante'};if(n<70){let d=n-n%10,r=n%10;return t[d]+(r?(r===1?' et un':'-'+u[r]):'')}if(n<80)return n===71?'soixante et onze':'soixante-'+number(n-60);if(n<100)return n===80?'quatre-vingts':'quatre-vingt-'+number(n-80);let h=Math.floor(n/100),r=n%100;return(h===1?'cent':u[h]+' cent'+(r?'':'s'))+(r?' '+number(r):'')}
function numbers(){return '<div class="card"><h2>Numbers</h2><p>0–999 · 法语数字查询与听写</p><div class="row"><input id="num" type="number" min="0" max="999" value="71"><button id="numgo" class="primary">查看</button></div><div id="numresult"></div><div class="row"><button id="numquiz">数字听写 · 10题</button></div><p class="mut">70 = 60 + 10；80 = 4 × 20；90 = 4 × 20 + 10。注意 71 的 et、80 的 s，以及 81 不用 et。</p></div>'}
function numshow(){let n=Number(el('num').value);if(!Number.isInteger(n)||n<0||n>999){el('numresult').textContent='请输入 0–999 的整数';return}el('numresult').innerHTML='<div class="big">'+n+'</div><h2 style="text-align:center">'+number(n)+'</h2><p style="text-align:center"><button data-say="'+number(n)+'">▶ 法语发音</button></p>'}
const LESSONS=[
  {
    "why": "其实就一条：规则 -er 只换词尾，词干从头到尾不动。-e、-es、-ent 都不发音，所以 je、tu、il、ils 听起来完全一样；真正读出来的只有 nous 的 -ons 和 vous 的 -ez。",
    "steps": [
      "parler（说话）去掉 -er，词干是 parl-。六个人称都用这一套词干。",
      "je parle（我说话）、tu parles（你说话）、il parle（他说话）、ils parlent（他们说话）：词尾 -e、-es、-ent 都不发音，四格同音 /paʁl/。听起来一样，拼写仍然要分开。",
      "nous parlons（我们说话）/paʁ.lɔ̃/，vous parlez（你们说话）/paʁ.le/：-ons 读 /ɔ̃/，-ez 读 /e/。"
    ],
    "mechanism": "记「一套词干 + 六个词尾：-e、-es、-e、-ons、-ez、-ent」。把 je、tu、il、ils 连成一只靴子：靴子里面词尾不发音，nous 和 vous 在靴子外面，靠读音分开。同样：aimer（爱）→ j'aime / nous aimons；regarder（看）→ je regarde / nous regardons；écouter（听）→ j'écoute / nous écoutons。elle 与 il 同形，elles 与 ils 同形；vous 说「您」或「你们」，变位都一样。后面各组按这个约定，不再逐格重复。",
    "exceptions": "aller（去）虽然以 -er 结尾，变位却是 je vais，不要写成 j'alle。manger、commencer 要保护辅音读音，见第 2 类；préférer、acheter、appeler 会改词干元音，见第 3 类。肯定命令式的 tu 不带 -s：Parle ! 后面紧跟 en 或 y 时，为了好读把 s 加回来：Parles-en（说说这个）。"

    "steps": [
      "manger（吃）去掉 -er，词干 mang-。这个 g 六个人称都要读 /ʒ/。",

      "nous mangeons（我们吃）/mɑ̃.ʒɔ̃/：在 g 和 o 之间加一个自己不发音的 e，g 才不会读成 /g/。vous mangez（你们吃）：-ez 里已经有 e，不用再加。",

    "mechanism": "现在时只记一条：只有 nous 改拼写。-ger → nous -geons；-cer → nous -çons。vous 一律不动。同样：voyager（旅行）→ nous voyageons；nager（游泳）→ nous nageons；lancer（投掷）→ nous lançons。",
    "exceptions": "不要写成 nous mangons、nous commencons，也不要把 e 或 ç 加到 vous 上：vous mangez、vous commencez 是对的。ç 用在 a、o、u 前面。未完成过去时碰到 a，还是这一条：je mangeais、je commençais。"
  },
  {
    "why": "【先把规则完整说清楚】在 préférer（更喜欢）这一类含 é 的 -er 动词里：当词干中相关的 é 后面接一个含不发音 e 的词尾（-e、-es、-ent）时，这个 é 要写成 è；当后面接发音的词尾（-ons、-ez）时，保留 é。这里说的是特定动词的词干元音变化，不是法语里每一个 e 都必须这样变。",

    "mechanism": "【为什么】é 通常对应较闭的 /e/，è 通常对应较开的 /ɛ/。对 préférer（更喜欢）这样的动词，词尾含不发音的 e 时，词干中相关元音读 /ɛ/，所以用 è 标示；-ons、-ez 是发音的词尾，相关元音保留 /e/，所以写 é。关键是词干音节和词尾的关系，不是把词尾里的 e 改掉。完整对照：je préfère（我更喜欢）｜tu préfères（你更喜欢）｜il préfère（他更喜欢）｜nous préférons（我们更喜欢）｜vous préférez（你们更喜欢）｜ils préfèrent（他们更喜欢）。",

function familyNote(i){let bag=db.familyNotes,v=bag&&bag[G[i][1]];return typeof v==='string'?v:''}
function lessonHTML(i){let x=LESSONS[i];return '<section class="note" style="background:#fff8f4;border:1px solid #f0e3dd"><h3>为什么会这样变？</h3><p>'+x.why+'</p><h3>一步一步推导</h3><ol>'+x.steps.map(t=>'<li style="margin:9px 0">'+t+'</li>').join('')+'</ol><h3>背后的规律</h3><p>'+x.mechanism+'</p><h3>例外与易错点</h3><p>'+x.exceptions+'</p><div class="row between" style="margin:2px 0 6px"><label for="familynote" style="margin:0">我的笔记</label><span class="mut" id="notesaved" aria-live="polite"></span></div><textarea id="familynote" rows="4" autocomplete="off" placeholder="在这里写下你自己的备注…">'+esc(familyNote(i))+'</textarea></section>'}
function verbs(){let g=G[selected],v=V[selected];return '<div class="card"><h2>Verbs</h2><p class="mut">官方只有 3 个动词组；下面 12 类是教学分类，不是官方分组。</p><label>现在时变位家族</label><select id="group">'+G.map((x,i)=>'<option value="'+i+'" '+(i===selected?'selected':'')+'>'+(i+1)+'. '+x[0]+'</option>').join('')+'</select><div class="note"><h3>'+g[1]+'（'+g[2]+'）</h3><p>'+g[4]+'</p><button data-say="'+g[1]+'">▶ 原形发音</button></div>'+lessonHTML(selected)+'<div class="scroll"><table><thead><tr><th>人称</th><th>Présent（现在时）</th><th></th></tr></thead><tbody>'+P.map((p,i)=>'<tr><td>'+p+'</td><td><b>'+v.forms[i]+'</b></td><td><button data-say="'+p.split(' /')[0]+' '+v.forms[i]+'">▶</button></td></tr>').join('')+'</tbody></table></div><p><button class="primary" id="groupquiz">练习这一类</button></p><details><summary>同类与高频特殊动词参考表</summary><div class="scroll"><table>'+V.filter(x=>x.group===-1).map(x=>'<tr><td>'+x.name+'（'+x.zh+'）</td><td>'+x.forms.join(' / ')+'</td></tr>').join('')+'</table></div></details></div><div class="card"><h2>其他时态 · 构造地图</h2>'+[['Imparfait（未完成过去时）','nous 现在时词干去 -ons + -ais/-ais/-ait/-ions/-iez/-aient；être → ét-。'],['Passé composé（复合过去时）','avoir/être 现在时 + 过去分词；部分动词需性数配合。'],['Futur simple（简单将来时）','未来词干 + -ai/-as/-a/-ons/-ez/-ont；être → ser-、avoir → aur-、aller → ir-。'],['Conditionnel présent（条件式现在时）','未来词干 + 未完成过去时词尾。'],['Subjonctif présent（虚拟式现在时）','常用 ils/nous 两套现在时词干；être/avoir/aller 等有特殊形式。'],['Impératif（命令式）','主要用 tu/nous/vous；部分 -er 的 tu 形式去 s，vas-y（去吧）例外。'],['Futur proche（近将来）','aller 现在时 + 动词原形。'],['Passé récent（最近过去）','venir de + 动词原形。']].map(x=>'<details><summary>'+x[0]+'</summary><p>'+x[1]+'</p></details>').join('')+'</div>'}
function start(kind){let pool=kind==='group'?V.filter(x=>x.group===selected):V;let questions=Array.from({length:10},()=>{let v=pool[Math.floor(Math.random()*pool.length)],p=Math.floor(Math.random()*6);return{v:v.name,zh:v.zh,p,answer:v.forms[p],kind}});if(kind==='number')questions=Array.from({length:10},()=>{let n=Math.floor(Math.random()*1000);return{v:String(n),zh:'',p:0,answer:String(n),kind}});if(kind==='wrong'){let keys=Object.keys(db.wrong);questions=keys.length?keys.slice(0,10).map(k=>{let [v,p]=k.split('|'),item=V.find(x=>x.name===v);return{v,p:+p,zh:item.zh,answer:item.forms[+p],kind}}):questions}quiz={questions,i:0,results:[],feedback:null};go('practice')}
function practice(){if(!quiz)return '<div class="card"><h2>Practice</h2><p class="mut">逐题作答、查看解析、记录错题；每轮 10 题。</p><div class="grid"><button class="tile" id="mix"><strong>Mixed</strong><span class="mut">所有动词 · 六人称混合</span></button><button class="tile" id="wrong"><strong>Review</strong><span class="mut">复现错题</span></button></div><p class="mut">已完成 '+db.history.length+' 轮 · 待复习 '+Object.keys(db.wrong).length+' 项</p></div>';if(quiz.i>=quiz.questions.length)return summary();let q=quiz.questions[quiz.i],f=quiz.feedback;return '<div class="card"><div class="row between"><span class="pill">'+(q.kind==='number'?'数字听写':'Présent · 现在时')+'</span><span class="mut">'+(quiz.i+1)+' / '+quiz.questions.length+'</span></div><progress max="'+quiz.questions.length+'" value="'+quiz.i+'"></progress><div class="big">'+(q.kind==='number'?'♫':q.v+'（'+q.zh+'）')+'</div><p style="text-align:center">'+(q.kind==='number'?'<button data-say="'+number(Number(q.v))+'">▶ 听数字</button>':P[q.p]+' <button data-say="'+P[q.p].split(' /')[0]+' '+q.answer+'">▶</button>')+'</p><label>输入'+(q.kind==='number'?'阿拉伯数字':'正确变位')+'</label><input class="answer" id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" '+(f?'disabled':'')+' placeholder="在这里输入" value="'+esc(f?.user||'')+'">'+(f?'<div class="note"><b class="'+(f.ok?'good':'bad')+'">'+(f.ok?'正确':'需要修正')+'</b><p>你的答案：'+esc(f.user)+'<br>正确答案：<b>'+esc(q.answer)+'</b></p><p>'+esc(f.why)+'</p></div><button id="next" class="primary">'+(quiz.i===quiz.questions.length-1?'查看结果':'下一题')+' ↵</button>':'<button id="check" class="primary">提交答案 ↵</button>' )+'</div>'}
function check(){let q=quiz.questions[quiz.i],user=el('answer').value.trim();if(!user)return;let ok=user.normalize('NFC').toLowerCase()===q.answer.normalize('NFC').toLowerCase();let why=q.kind==='number'?'数字听辨：正确的数字是 '+q.answer+'。':'主语 '+P[q.p]+' 决定人称，动词 '+q.v+' 的这一格是 '+q.answer+'。'+(G.find(g=>g[1]===q.v)?.[4]||'这是该动词的特殊变位，需要按词干与词尾记忆。');quiz.feedback={user,ok,why};quiz.results.push({...q,user,ok,why});if(!ok&&q.kind!=='number')db.wrong[q.v+'|'+q.p]=true;else if(ok)delete db.wrong[q.v+'|'+q.p];render()}
function summary(){let score=quiz.results.filter(x=>x.ok).length;return '<div class="card"><h2>本轮结果 · '+score+'/'+quiz.questions.length+'</h2><p>错误题号：'+(quiz.results.map((x,i)=>x.ok?'':i+1).filter(Boolean).join('、')||'无')+'</p>'+quiz.results.map((x,i)=>'<details><summary>'+(i+1)+'. '+(x.ok?'✓':'✗')+' '+x.v+'</summary><p>你的答案：'+esc(x.user)+'；正确答案：'+esc(x.answer)+'</p><p>'+esc(x.why)+'</p></details>').join('')+'<p><button class="primary" id="finish">记录结果并继续</button></p></div>'}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));if(el('numgo')){el('numgo').onclick=numshow;numshow()}if(el('numquiz'))el('numquiz').onclick=()=>start('number');if(el('group'))el('group').onchange=e=>{selected=+e.target.value;render()};if(el('familynote'))el('familynote').oninput=()=>{db.familyNotes[G[selected][1]]=el('familynote').value;let h=el('notesaved');if(h)h.textContent=save()?'已保存':'未能保存'};if(el('groupquiz'))el('groupquiz').onclick=()=>start('group');if(el('mix'))el('mix').onclick=()=>start('mix');if(el('wrong'))el('wrong').onclick=()=>start('wrong');if(el('check'))el('check').onclick=check;if(el('next'))el('next').onclick=()=>{quiz.i++;quiz.feedback=null;render()};if(el('finish'))el('finish').onclick=()=>{db.history.push({date:new Date().toISOString(),results:quiz.results,});save();quiz=null;render()};if(el('answer'))el('answer').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();if(quiz.feedback){quiz.i++;quiz.feedback=null;render()}else check()}}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b)speak(b.dataset.say)});
render();
</script></body></html>

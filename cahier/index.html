const LESSONS=[
  {
    "why": "其实就一条：规则 -er 只换词尾，词干从头到尾不动。-e、-es、-ent 都不发音，所以 je、tu、il、ils 听起来完全一样；真正读出来的只有 nous 的 -ons 和 vous 的 -ez。",

    "steps": [

function playPractice(){if(!quiz||quiz.current===null)return;let q=quiz.questions[quiz.current];speak(q.speak||(q.kind==='number'?number(Number(q.v)):PERSON[q.p].split(' /')[0]+' '+q.answer))}
function practice(){
 if(!quiz)return '<div class="card"><h2>Practice · Spelling</h2><p class="mut">结合 Pêche Learn 的约 5 题轮巡与 Spelling 的听写规则：连续正确两次过关，答错原题重写，全键盘操作。法语变位按动词与人称逐格练习。</p><div class="grid"><button class="tile" id="mix"><strong>Mixed</strong><span class="mut">全部动词 · 混合六人称</span></button><button class="tile" id="wrong"><strong>Review</strong><span class="mut">只练历史错题</span></button></div><p class="mut">已完成 '+db.history.length+' 轮 · 待复习 '+Object.keys(db.wrong).length+' 项</p><label for="practiceNote">自由记录 / 疑问</label><textarea id="practiceNote" placeholder="写下疑问、想法或需要复习的点…">'+esc(practiceNote)+'</textarea></div>';
 if(quiz.current===null)return summary();
 let q=quiz.questions[quiz.current],f=quiz.feedback,id=quiz.current,streak=quiz.streak[id]||0;
 let prompt=q.prompt||(q.kind==='number'?'听写数字':esc(q.v)+' <small>（'+esc(q.zh)+'）</small>');
 let label=q.label||(q.kind==='number'?'听数字，输入阿拉伯数字':esc(PERSON[q.p])+' · 输入正确变位');
 return '<div class="card practice-card"><div class="row between"><span class="pill">Spelling · '+(q.kind==='number'?'Numbers':String(q.kind||'').startsWith('inspire-adj')?'Inspire 1 · Adjectifs':String(q.kind||'').startsWith('inspire-pc')?'Inspire 1 · Passé composé':String(q.kind||'').startsWith('inspire')?'Inspire 1 · Présent':'Présent')+'</span><span class="mut">已掌握 '+quiz.completed+' / '+quiz.questions.length+'</span></div><progress max="'+quiz.questions.length+'" value="'+quiz.completed+'"></progress><div class="practice-streak">本题连续正确 '+streak+' / 2</div><div class="big">'+prompt+'</div><div class="practice-prompt">'+label+'</div><p class="practice-audio"><button id="replay" type="button">▶ 播放法语 · Tab</button></p><input class="answer" id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="输入法语变位" placeholder="听写答案 · Enter 检查" value="">'+(f?'<div class="note"><b class="bad">拼写错误 · 再写一次</b><p>你的答案：'+esc(f.user)+'<br>正确答案：<b>'+esc(q.answer)+'</b></p><p>'+esc(f.why)+'</p></div>':'')+'<p class="mut" style="text-align:center">Enter 检查 · Tab 重播 · 正确后 Space 继续</p><label for="practiceNote">自由输入 · 疑问 / 想法</label><textarea id="practiceNote" placeholder="不会的规则、补充问题…">'+esc(quiz.note||'')+'</textarea></div>'
}
function check(){
 if(!quiz||quiz.current===null)return;
 let q=quiz.questions[quiz.current],id=quiz.current,input=el('answer');if(!input)return;
 let user=input.value.trim();if(!user)return;
 let ok=inspireAnswers(q).some(a=>foldAns(user)===foldAns(a));
 let why=q.why||(q.kind==='number'?'数字听写：'+q.answer:'人称 '+PERSON[q.p]+' 对应 '+q.v+' → '+q.answer+'。'+(G.find(g=>g[1]===q.v)?.[4]||'注意词干、词尾与重音符号。'));
 quiz.attempts[id]=(quiz.attempts[id]||0)+1;
 if(ok){
  quiz.streak[id]=(quiz.streak[id]||0)+1;
  if(quiz.streak[id]>=2){quiz.completed++;if(q.kind!=='number')delete db.wrong[q.wrongKey||(q.v+'|'+q.p)];refillPractice()}
  else quiz.queue.push(id);
  quiz.results.push({...q,user,ok:true,why,attempt:quiz.attempts[id]});
  quiz.feedback={ok:true};
  render();setTimeout(()=>{let n=el('nextPractice');n?.focus()},0);
 }else{
  quiz.streak[id]=0;quiz.missed[id]=true;
  if(q.kind!=='number')db.wrong[q.wrongKey||(q.v+'|'+q.p)]=true;
  quiz.results.push({...q,user,ok:false,why,attempt:quiz.attempts[id]});
  quiz.feedback={ok:false,user,why};
  if(!quiz.queue.includes(id))quiz.queue.push(id);
  render();setTimeout(()=>el('answer')?.focus(),0);
 }
 save();persistPractice()
}
function summary(){
 let first=quiz.questions.map((q,id)=>({q,id,wrong:!!quiz.missed[id]}));
 let correct=first.filter(x=>!x.wrong).length,errors=first.filter(x=>x.wrong);
 return '<div class="card"><h2>完成 · '+quiz.completed+'/'+quiz.questions.length+' 项</h2><p>首次及复现过程无错误：'+correct+' / '+quiz.questions.length+'；出现过错误：'+errors.length+' 项</p><p>错误题号：'+(errors.map(x=>x.id+1).join('、')||'无')+'</p>'+first.map(({q,id,wrong})=>'<details><summary>'+(id+1)+'. '+(wrong?'✗':'✓')+' '+(q.prompt?q.prompt.replace(/<[^>]+>/g,''):esc(q.v)+' · '+esc(PERSON[q.p]))+'</summary><p>正确答案：<b>'+esc(q.answer)+'</b></p><p>你的作答：'+quiz.results.filter(r=>r.v===q.v&&r.p===q.p).map(r=>esc(r.user)+(r.ok?' ✓':' ✗')).join(' → ')+'</p><p>'+esc(quiz.results.find(r=>r.v===q.v&&r.p===q.p)?.why||'')+'</p></details>').join('')+'<label for="practiceNote">自由输入 · 随本轮记录</label><textarea id="practiceNote">'+esc(quiz.note||'')+'</textarea><p><button class="primary" id="finish">记录结果并继续</button></p></div>'
}
function bind(){
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
 if(el('numgo')){el('numgo').onclick=numshow;numshow()}
 if(el('numquiz'))el('numquiz').onclick=()=>start('number');
 if(el('group'))el('group').onchange=e=>{selected=+e.target.value;render()};
 if(el('familynote'))el('familynote').oninput=()=>{db.familyNotes[G[selected][1]]=el('familynote').value;let h=el('notesaved');if(h)h.textContent=save()?'已保存':'未能保存'};
 if(el('groupquiz'))el('groupquiz').onclick=()=>start('group');
 if(el('mix'))el('mix').onclick=()=>start('mix');
 if(el('wrong'))el('wrong').onclick=()=>start('wrong');
 if(el('inspirePracticeAll'))el('inspirePracticeAll').onclick=()=>startInspire('all');
 if(el('inspirePracticeV'))el('inspirePracticeV').onclick=()=>startInspire('verb');
 if(el('inspirePracticeA'))el('inspirePracticeA').onclick=()=>startInspire('adj');
 if(el('inspirePracticePc'))el('inspirePracticePc').onclick=()=>startInspire('pc');
 document.querySelectorAll('[data-inspire-practice]').forEach(b=>b.onclick=()=>startInspire(b.dataset.inspirePractice));
 document.querySelectorAll('[data-inspire-chip]').forEach(b=>b.onclick=()=>{inspireFilter=b.dataset.inspireChip;applyInspireFilter()});
 if(el('inspireq')){el('inspireq').oninput=e=>{inspireQuery=e.target.value;applyInspireFilter()};applyInspireFilter()}

 if(el('replay'))el('replay').onclick=playPractice;
 if(el('practiceNote'))el('practiceNote').oninput=e=>{practiceNote=e.target.value;if(quiz){quiz.note=practiceNote;persistPractice()}};
 if(el('finish'))el('finish').onclick=()=>{db.history.push({date:new Date().toISOString(),results:quiz.results,questions:quiz.questions,missed:quiz.missed,note:quiz.note});save();practiceNote='';quiz=null;persistPractice();render()};
 if(el('answer')){el('answer').focus();el('answer').oninput=()=>{if(quiz?.feedback&&!quiz.feedback.ok){quiz.feedback=null;document.querySelector('.note')?.remove();persistPractice()}}}
 if(quiz?.feedback?.ok){let box=el('answer');if(box){box.value=quiz.questions[quiz.current].answer;box.disabled=true;let b=document.createElement('button');b.id='nextPractice';b.className='primary';b.textContent='正确 ✓ · 继续 Space';b.onclick=nextPractice;box.insertAdjacentElement('afterend',b)}}
}
document.addEventListener('keydown',e=>{
 if(tab!=='practice'||!quiz||quiz.current===null)return;
 if(e.key==='Tab'&&e.target.id!=='practiceNote'){e.preventDefault();playPractice();return}
 if(e.key==='Enter'&&e.target.id==='answer'){e.preventDefault();if(quiz.feedback?.ok)nextPractice();else check();return}
 if((e.key===' '||e.code==='Space')&&quiz.feedback?.ok&&e.target.id!=='practiceNote'){e.preventDefault();nextPractice()}
});
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b)speak(b.dataset.say)});
render();
</script></body></html>

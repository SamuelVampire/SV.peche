const G=[["规则 -er","parler","说话","parle,parles,parle,parlons,parlez,parlent","去掉 -er，加 -e/-es/-e/-ons/-ez/-ent；aller 是第三组。"],["-ger / -cer","manger","吃","mange,manges,mange,mangeons,mangez,mangent","nous 的 -geons 保留 /ʒ/；commencer → nous commençons，ç 保留 /s/。"],["词干变化 -er","appeler","打电话","appelle,appelles,appelle,appelons,appelez,appellent","je/tu/il/ils 常改变词干；préférer → préfère，acheter → achète；payer → paie/paye。"],["规则第二组 -ir","finir","完成","finis,finis,finit,finissons,finissez,finissent","判断标志是 nous -issons、现在分词 -issant；partir 不属于第二组。"],["短词干 -ir","partir","离开","pars,pars,part,partons,partez,partent","partir/sortir/dormir：单数短词干，复数长词干；courir、mourir 不套此规则。"],["第三组 -er 式词尾","ouvrir","打开","ouvre,ouvres,ouvre,ouvrons,ouvrez,ouvrent","ouvrir/offrir/cueillir 的现在时词尾像 -er，但过去分词不一定相同：ouvert。"],["vendre 类 -re","vendre","卖","vends,vends,vend,vendons,vendez,vendent","词干保留 d；-s/-s/无附加词尾/-ons/-ez/-ent；prendre、mettre 另算。"],["prendre 家族","prendre","拿","prends,prends,prend,prenons,prenez,prennent","三套词干 prend-/pren-/prenn-；apprendre、comprendre 同族。"],["mettre 家族","mettre","放置","mets,mets,met,mettons,mettez,mettent","单数 met-，复数 mett-；permettre、promettre 同族。"],["venir / tenir","venir","来","viens,viens,vient,venons,venez,viennent","三套词干 vien-/ven-/vienn-；tenir → tiens/tenons/tiennent。"],["-oir 与特殊家族","pouvoir","能够","peux,peux,peut,pouvons,pouvez,peuvent","不能用一张 -oir 词尾表；vouloir、devoir、voir、savoir、recevoir 各有模式。"],["四个高频特殊动词","être","是","suis,es,est,sommes,êtes,sont","être、avoir、aller、faire 必须完整记忆；être 和 avoir 还用于复合时态。"]],X=[["avoir","有","ai,as,a,avons,avez,ont"],["aller","去","vais,vas,va,allons,allez,vont"],["faire","做","fais,fais,fait,faisons,faites,font"],["commencer","开始","commence,commences,commence,commençons,commencez,commencent"],["préférer","更喜欢","préfère,préfères,préfère,préférons,préférez,préfèrent"],["acheter","购买","achète,achètes,achète,achetons,achetez,achètent"],["choisir","选择","choisis,choisis,choisit,choisissons,choisissez,choisissent"],["sortir","出去","sors,sors,sort,sortons,sortez,sortent"],["dormir","睡觉","dors,dors,dort,dormons,dormez,dorment"],["offrir","赠送","offre,offres,offre,offrons,offrez,offrent"],["attendre","等待","attends,attends,attend,attendons,attendez,attendent"],["comprendre","理解","comprends,comprends,comprend,comprenons,comprenez,comprennent"],["permettre","允许","permets,permets,permet,permettons,permettez,permettent"],["tenir","拿住","tiens,tiens,tient,tenons,tenez,tiennent"],["vouloir","想要","veux,veux,veut,voulons,voulez,veulent"],["devoir","必须","dois,dois,doit,devons,devez,doivent"],["voir","看见","vois,vois,voit,voyons,voyez,voient"],["savoir","知道","sais,sais,sait,savons,savez,savent"],["recevoir","收到","reçois,reçois,reçoit,recevons,recevez,reçoivent"],["dire","说","dis,dis,dit,disons,dites,disent"],["lire","阅读","lis,lis,lit,lisons,lisez,lisent"],["écrire","写","écris,écris,écrit,écrivons,écrivez,écrivent"],["boire","喝","bois,bois,boit,buvons,buvez,boivent"]],P=['je','tu','il / elle / on','nous','vous','ils / elles'];
const V=[...G.map((g,i)=>({name:g[1],zh:g[2],forms:g[3].split(','),group:i})),...X.map(x=>({name:x[0],zh:x[1],forms:x[2].split(','),group:-1}))];

function speak(s){if(!('speechSynthesis'in window)){el('voice').textContent='当前浏览器不支持语音播放。';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='fr-FR';u.rate=.82;let vs=speechSynthesis.getVoices().filter(x=>x.lang.toLowerCase().startsWith('fr'));if(vs.length)u.voice=vs.find(x=>x.lang==='fr-FR')||vs[0];u.onerror=()=>el('voice').textContent='法语语音播放失败，请检查系统法语语音包。';speechSynthesis.speak(u)}

function home(){return '<div class="grid">'+[['sounds','Sounds','音标 · 字母组合'],['numbers','Numbers','数字 0–999'],['verbs','Verbs','现在时 12 类 · 其他时态'],['practice','Practice','混合练习 · 错题']].map(([id,t,sub])=>'<button class="tile" data-go="'+id+'"><strong>'+t+'</strong><span class="mut">'+sub+'</span></button>').join('')+'</div><p class="mut" style="text-align:center;margin-top:25px">进度保存在当前浏览器 · 不影响 Pêche 本体</p>'}
const PH=[['/i/','i, î, ï','si（如果）、île（岛）'],['/y/','u, û','tu（你）、lune（月亮）'],['/u/','ou, où','vous（您／你们）、où（哪里）'],['/e/','é, -er, -ez','été（夏天）、parler（说话）'],['/ɛ/','è, ê, ai, ei','mère（母亲）、lait（牛奶）'],['/ø/','eu, œu','deux（二）'],['/œ/','eu, œu','sœur（姐妹）'],['/ɑ̃/','an, en, am, em','sans（没有）、enfant（孩子）'],['/ɛ̃/','in, ain, ein, im','vin（葡萄酒）、pain（面包）'],['/ɔ̃/','on, om','bon（好的）、nom（名字）'],['/ʒ/','j, ge','je（我）、manger（吃）'],['/ʃ/','ch','chat（猫）'],['/ɲ/','gn','montagne（山）'],['/wa/','oi','moi（我）'],['/ɥi/','ui','huit（八）']];
function sounds(){return '<div class="card"><h2>Sounds</h2><p class="mut">点例词播放法语；IPA 是近似标准读法，实际口音存在差异。法语元音与拼写不是一对一。</p><div class="grid">'+PH.map(x=>'<div class="tile"><h3>'+x[0]+'</h3><div class="mut">'+x[1]+'</div><p>'+x[2]+'</p><button data-say="'+x[2].split('（')[0]+'">▶ 播放</button></div>').join('')+'</div><details><summary>重音符号与特殊字母</summary><p>accent aigu（尖音符）é；accent grave（钝音符）è、à、ù；accent circonflexe（长音符）â、ê、î、ô、û；tréma（分音符）ë、ï、ü、ÿ；cédille（软音符）ç。它们不一定都改变读音。</p></details></div>'}
function number(n){let u=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize'];if(n<17)return u[n];if(n<20)return 'dix-'+u[n-10];let t={20:'vingt',30:'trente',40:'quarante',50:'cinquante',60:'soixante'};if(n<70){let d=n-n%10,r=n%10;return t[d]+(r?(r===1?' et un':'-'+u[r]):'')}if(n<80)return n===71?'soixante et onze':'soixante-'+number(n-60);if(n<100)return n===80?'quatre-vingts':'quatre-vingt-'+number(n-80);let h=Math.floor(n/100),r=n%100;return(h===1?'cent':u[h]+' cent'+(r?'':'s'))+(r?' '+number(r):'')}
function numbers(){return '<div class="card"><h2>Numbers</h2><p>0–999 · 法语数字查询与听写</p><div class="row"><input id="num" type="number" min="0" max="999" value="71"><button id="numgo" class="primary">查看</button></div><div id="numresult"></div><div class="row"><button id="numquiz">数字听写 · 10题</button></div><p class="mut">70 = 60 + 10；80 = 4 × 20；90 = 4 × 20 + 10。注意 71 的 et、80 的 s，以及 81 不用 et。</p></div>'}
function numshow(){let n=Number(el('num').value);if(!Number.isInteger(n)||n<0||n>999){el('numresult').textContent='请输入 0–999 的整数';return}el('numresult').innerHTML='<div class="big">'+n+'</div><h2 style="text-align:center">'+number(n)+'</h2><p style="text-align:center"><button data-say="'+number(n)+'">▶ 法语发音</button></p>'}
const LESSONS=[{"why":"第一组规则 -er：先分清原形、词干、人称词尾。","steps":["① parler（说话）去掉 -er，留下 parl-。","② 按主语加 -e / -es / -e / -ons / -ez / -ent。","③ je parle（我说话）、nous parlons（我们说话）、ils parlent（他们说话）。"],"mechanism":"词尾表示主语的人称和数。-e、-es、-ent 通常不发音，因此 parle（说）、parles（说）、parlent（说）通常同音；-ons、-ez 可听出差别。","exceptions":"aller（去）虽然以 -er 结尾，却是第三组；manger（吃）、préférer（更喜欢）等仍属第一组，但需额外拼写调整。"},{"why":"为什么 nous（我们）会多出 e 或 ç？为了保护原本的辅音发音，而不是另换一套人称词尾。","steps":["① manger（吃）→ mang- + -ons 本应得到 mangons，但 g 在 o 前通常读 /g/。","② 加一个 e 隔开 g 和 o：nous mangeons（我们吃），保留 /ʒ/。","③ commencer（开始）→ commenc- + -ons；c 在 o 前通常读 /k/。","④ 把 c 写成 ç：nous commençons（我们开始），保留 /s/。"],"mechanism":"g + e/i 通常读 /ʒ/，g + a/o/u 通常读 /g/；c + e/i 通常读 /s/，c + a/o/u 通常读 /k/。这里改变的是拼写，不是 -ons 词尾。","exceptions":"vous mangez（你们吃）、vous commencez（你们开始）后面本来就是 e，不需要额外改写。voyager（旅行）→ voyageons（我们旅行）；lancer（投掷）→ lançons（我们投掷）。"},{"why":"先看词干后面那个音节：如果接的是不发音的词尾 -e、-es、-ent，词干里的某些元音需要调整读音；接发音的 -ons、-ez 时，通常保留原形的词干。把 je、tu、il、ils 看作一组，nous、vous 看作另一组，会更容易记。","steps":["① préférer（更喜欢）：原形中靠近词尾的 é，在 je/tu/il/ils 四格改写为 è：je préfère（我更喜欢）、tu préfères（你更喜欢）、il préfère（他更喜欢）、ils préfèrent（他们更喜欢）。","② nous/vous 的 -ons、-ez 有发音：nous préférons（我们更喜欢）、vous préférez（你们更喜欢），这里仍写 é。","③ 同一思路下，acheter（购买）的 e → è：j’achète（我购买）、nous achetons（我们购买）；lever（抬起）的 e → è：je lève（我抬起）、nous levons（我们抬起）。","④ 另一种拼写办法是双写辅音：appeler（打电话）→ j’appelle（我打电话）、nous appelons（我们打电话）；jeter（扔）→ je jette（我扔）、nous jetons（我们扔）。"],"mechanism":"重点不是“看到 é 就改 è”，而是看它所在的词干、后续词尾及读音。像 préférer（更喜欢）这类动词，相关音节在 je/tu/il/ils 的形式中读开口 /ɛ/，书写为 è；nous/vous 保留 é。acheter（购买）等用 e → è 表示读音变化；appeler（打电话）等通过双写辅音配合前面的 e 表示 /ɛ/。这是帮助理解的发音线索，并非所有 -er 动词都适用的万能公式。","exceptions":"记忆图形：je、tu、il、ils 四格通常一起变化，nous、vous 两格通常保持原词干。注意 préférer（更喜欢）不是所有 é 都变：je préfère（我更喜欢）第一个 é 保留；espérer（希望）→ j’espère（我希望）/ nous espérons（我们希望）；répéter（重复）→ je répète（我重复）/ nous répétons（我们重复）。-eler/-eter 并非一律双写：appeler（打电话）双写 l，但 acheter（购买）用 è。payer（付款）还有 je paie / je paye（我付款）等形式。"},{"why":"第二组 -ir 不是所有 -ir 动词：它有可辨认的 -iss- 扩展词干。","steps":["① finir（完成）去掉 -ir 得 fin-。","② 单数加 -is/-is/-it：je finis（我完成）、tu finis（你完成）、il finit（他完成）。","③ 复数加 -issons/-issez/-issent：nous finissons（我们完成）、vous finissez（你们完成）、ils finissent（他们完成）。","④ choisir（选择）→ nous choisissons（我们选择）；现在分词 finissant（正在完成的）。"],"mechanism":"复数形式的 -iss- 是第二组动词的标志性扩展，不能理解为随便多加了两个 s。判断第二组常看 nous -issons 与现在分词 -issant。","exceptions":"partir（离开）→ nous partons（我们离开），不是 *partissons*；ouvrir（打开）→ nous ouvrons（我们打开），也不属于第二组。"},{"why":"partir 类 -ir 为什么单数看起来少一个字母？这类第三组动词有长短两套词干。","steps":["① partir（离开）：复数保留 part-，nous partons（我们离开）。","② 单数采用短词干 par-：je pars（我离开）、tu pars（你离开）、il part（他离开）。","③ dormir（睡觉）：je dors（我睡觉）/ nous dormons（我们睡觉）。","④ sortir（出去）：je sors（我出去）/ nous sortons（我们出去）。"],"mechanism":"单数常见 -s/-s/-t，复数 -ons/-ez/-ent；但词干必须先按家族选择，不能只给原形去掉 -ir 再加词尾。","exceptions":"finir（完成）是第二组；courir（跑）、mourir（死亡）等有自己的模式，不能全部照搬 partir（离开）。"},{"why":"为什么 ouvrir（打开）是第三组，却像第一组？动词分组不只看现在时词尾。","steps":["① ouvrir（打开）去掉 -ir，得到 ouvr-。","② 现在时加类似 -er 的 -e/-es/-e/-ons/-ez/-ent。","③ j’ouvre（我打开）、tu ouvres（你打开）、nous ouvrons（我们打开）、ils ouvrent（他们打开）。","④ offrir（赠送）→ j’offre（我赠送）；cueillir（采摘）→ je cueille（我采摘）。"],"mechanism":"它们现在时的词尾看起来像第一组，但原形并非 -er，其他时态和过去分词也有自己的规律。","exceptions":"ouvrir（打开）的过去分词是 ouvert（打开了的）；offrir（赠送）是 offert（赠送了的）。不能据现在时推断过去分词一定以 -é 结尾。"},{"why":"vendre 类 -re 的单数第三人称为什么不额外加字母？词干已经以 d 结尾。","steps":["① vendre（卖）去掉 -re，得到 vend-。","② je vends（我卖）、tu vends（你卖）：加 -s。","③ il vend（他卖）：没有额外词尾，保留词干中的 d。","④ nous vendons（我们卖）、vous vendez（你们卖）、ils vendent（他们卖）。"],"mechanism":"可概括为 -s/-s/零词尾/-ons/-ez/-ent；这里的“零词尾”不代表删掉原来词干的 d。","exceptions":"attendre（等待）→ il attend（他等待）；répondre（回答）→ il répond（他回答）。prendre（拿）、mettre（放）虽然也以 -re 结尾，但词干变化不同。"},{"why":"prendre（拿）不能按 vendre（卖）套：它同时改变词干拼写和词尾。","steps":["① 单数 prend-：je prends（我拿）、tu prends（你拿）、il prend（他拿）。","② nous/vous 用 pren-：nous prenons（我们拿）、vous prenez（你们拿）。","③ ils/elles 用 prenn-：ils prennent（他们拿）。","④ comprendre（理解）→ je comprends（我理解）、nous comprenons（我们理解）、ils comprennent（他们理解）。"],"mechanism":"这是三套词干 prend-/pren-/prenn- 的交替；复数 nous/vous 去掉 d，第三人称复数双写 n。变位时先选词干，再配人称。","exceptions":"apprendre（学习）、comprendre（理解）跟随 prendre 家族；不要写 *nous prendons* 或 *ils prendent*。"},{"why":"mettre（放置）有 met- 与 mett- 两套词干，不能把双 t 写进所有人称。","steps":["① 单数 je mets（我放）、tu mets（你放）、il met（他放）。","② 复数 nous mettons（我们放）、vous mettez（你们放）、ils mettent（他们放）。","③ permettre（允许）→ je permets（我允许）、nous permettons（我们允许）。"],"mechanism":"单数 met-，复数 mett-；单数第三人称 met（他放）末尾 t 属于形式本身，不能写 *mett*。","exceptions":"promettre（承诺）也同族。注意 mettre（放置）的过去分词 mis（放置了的），并不是 *metté*。"},{"why":"venir（来）与 tenir（拿住）为什么出现 ien/en/ienn？它们有三套对应不同人称的词干。","steps":["① venir（来）：je viens（我来）、tu viens（你来）、il vient（他来）。","② nous venons（我们来）、vous venez（你们来）。","③ ils viennent（他们来）。","④ tenir（拿住）：je tiens（我拿住）、nous tenons（我们拿住）、ils tiennent（他们拿住）。"],"mechanism":"单数 vien-，nous/vous 用 ven-，ils/elles 用 vienn-；拼写和元音读音一起变化。","exceptions":"devenir（成为）、revenir（回来）、obtenir（获得）分别跟随 venir 或 tenir 家族；venir（来）的过去分词 venu（来了的），tenir（拿住）的过去分词 tenu（拿住了的）。"},{"why":"-oir 只是原形拼写线索，不是一套统一变位。每个高频动词必须先识别自己的词干家族。","steps":["① pouvoir（能够）：je peux（我能）/ nous pouvons（我们能）/ ils peuvent（他们能）。","② vouloir（想要）：je veux（我想要）/ nous voulons（我们想要）/ ils veulent（他们想要）。","③ devoir（必须）：je dois（我必须）/ nous devons（我们必须）/ ils doivent（他们必须）。","④ voir（看见）：je vois（我看见）/ nous voyons（我们看见）/ ils voient（他们看见）。","⑤ savoir（知道）：je sais（我知道）/ nous savons（我们知道）/ ils savent（他们知道）。","⑥ recevoir（收到）：je reçois（我收到）/ nous recevons（我们收到）/ ils reçoivent（他们收到）。"],"mechanism":"有的发生元音交替，有的发生词干辅音变化；-oir 不能直接告诉你六个人称的词尾。先记各家族 je/nous/ils 三个锚点，再补全 tu/il/vous。","exceptions":"pouvoir（能够）的 je peux（我能）与 je puis（我能，较正式/特定句式）都存在；例如 puis-je（我可以……吗，倒装）。"},{"why":"être（是）、avoir（有）、aller（去）、faire（做）频率极高，而且词干差异大，不能靠统一词尾推导。","steps":["① être（是）：je suis（我是）、tu es（你是）、il est（他是）、nous sommes（我们是）、vous êtes（您是）、ils sont（他们是）。","② avoir（有）：j’ai（我有）、tu as（你有）、il a（他有）、nous avons（我们有）、vous avez（您有）、ils ont（他们有）。","③ aller（去）：je vais（我去）、tu vas（你去）、il va（他去）、nous allons（我们去）、vous allez（您去）、ils vont（他们去）。","④ faire（做）：je fais（我做）、tu fais（你做）、il fait（他做）、nous faisons（我们做）、vous faites（您做）、ils font（他们做）。"],"mechanism":"这些形式保留了历史上不同词干的变化，现代法语学习中不能从原形直接机械生成。先按六个人称记忆，再在短句中辨认。","exceptions":"avoir（有）与 être（是）还是复合过去时的助动词；aller（去）构成近将来时 aller + 原形；faire（做）的 nous faisons（我们做）常读 /fə.zɔ̃/。"}];
function lessonHTML(i){let x=LESSONS[i];return '<section class="note" style="background:#fff8f4;border:1px solid #f0e3dd"><h3>为什么会这样变？</h3><p>'+x.why+'</p><h3>一步一步推导</h3><ol>'+x.steps.map(t=>'<li style="margin:9px 0">'+t+'</li>').join('')+'</ol><h3>背后的规律</h3><p>'+x.mechanism+'</p><h3>例外与易错点</h3><p>'+x.exceptions+'</p></section>'}
function verbs(){let g=G[selected],v=V[selected];return '<div class="card"><h2>Verbs</h2><p class="mut">官方只有 3 个动词组；下面 12 类是教学分类，不是官方分组。</p><label>现在时变位家族</label><select id="group">'+G.map((x,i)=>'<option value="'+i+'" '+(i===selected?'selected':'')+'>'+(i+1)+'. '+x[0]+'</option>').join('')+'</select><div class="note"><h3>'+g[1]+'（'+g[2]+'）</h3><p>'+g[4]+'</p><button data-say="'+g[1]+'">▶ 原形发音</button></div>'+lessonHTML(selected)+'<div class="scroll"><table><thead><tr><th>人称</th><th>Présent（现在时）</th><th></th></tr></thead><tbody>'+P.map((p,i)=>'<tr><td>'+p+'</td><td><b>'+v.forms[i]+'</b></td><td><button data-say="'+p.split(' /')[0]+' '+v.forms[i]+'">▶</button></td></tr>').join('')+'</tbody></table></div><p><button class="primary" id="groupquiz">练习这一类</button></p><details><summary>同类与高频特殊动词参考表</summary><div class="scroll"><table>'+V.filter(x=>x.group===-1).map(x=>'<tr><td>'+x.name+'（'+x.zh+'）</td><td>'+x.forms.join(' / ')+'</td></tr>').join('')+'</table></div></details></div><div class="card"><h2>其他时态 · 构造地图</h2>'+[['Imparfait（未完成过去时）','nous 现在时词干去 -ons + -ais/-ais/-ait/-ions/-iez/-aient；être → ét-。'],['Passé composé（复合过去时）','avoir/être 现在时 + 过去分词；部分动词需性数配合。'],['Futur simple（简单将来时）','未来词干 + -ai/-as/-a/-ons/-ez/-ont；être → ser-、avoir → aur-、aller → ir-。'],['Conditionnel présent（条件式现在时）','未来词干 + 未完成过去时词尾。'],['Subjonctif présent（虚拟式现在时）','常用 ils/nous 两套现在时词干；être/avoir/aller 等有特殊形式。'],['Impératif（命令式）','主要用 tu/nous/vous；部分 -er 的 tu 形式去 s，vas-y（去吧）例外。'],['Futur proche（近将来）','aller 现在时 + 动词原形。'],['Passé récent（最近过去）','venir de + 动词原形。']].map(x=>'<details><summary>'+x[0]+'</summary><p>'+x[1]+'</p></details>').join('')+'</div>'}
function start(kind){let pool=kind==='group'?V.filter(x=>x.group===selected):V;let questions=Array.from({length:10},()=>{let v=pool[Math.floor(Math.random()*pool.length)],p=Math.floor(Math.random()*6);return{v:v.name,zh:v.zh,p,answer:v.forms[p],kind}});if(kind==='number')questions=Array.from({length:10},()=>{let n=Math.floor(Math.random()*1000);return{v:String(n),zh:'',p:0,answer:String(n),kind}});if(kind==='wrong'){let keys=Object.keys(db.wrong);questions=keys.length?keys.slice(0,10).map(k=>{let [v,p]=k.split('|'),item=V.find(x=>x.name===v);return{v,p:+p,zh:item.zh,answer:item.forms[+p],kind}}):questions}quiz={questions,i:0,results:[],feedback:null};go('practice')}
function practice(){if(!quiz)return '<div class="card"><h2>Practice</h2><p class="mut">逐题作答、查看解析、记录错题；每轮 10 题。</p><div class="grid"><button class="tile" id="mix"><strong>Mixed</strong><span class="mut">所有动词 · 六人称混合</span></button><button class="tile" id="wrong"><strong>Review</strong><span class="mut">复现错题</span></button></div><p class="mut">已完成 '+db.history.length+' 轮 · 待复习 '+Object.keys(db.wrong).length+' 项</p></div>';if(quiz.i>=quiz.questions.length)return summary();let q=quiz.questions[quiz.i],f=quiz.feedback;return '<div class="card"><div class="row between"><span class="pill">'+(q.kind==='number'?'数字听写':'Présent · 现在时')+'</span><span class="mut">'+(quiz.i+1)+' / '+quiz.questions.length+'</span></div><progress max="'+quiz.questions.length+'" value="'+quiz.i+'"></progress><div class="big">'+(q.kind==='number'?'♫':q.v+'（'+q.zh+'）')+'</div><p style="text-align:center">'+(q.kind==='number'?'<button data-say="'+number(Number(q.v))+'">▶ 听数字</button>':P[q.p]+' <button data-say="'+P[q.p].split(' /')[0]+' '+q.answer+'">▶</button>')+'</p><label>输入'+(q.kind==='number'?'阿拉伯数字':'正确变位')+'</label><input class="answer" id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" '+(f?'disabled':'')+' placeholder="在这里输入" value="'+esc(f?.user||'')+'">'+(f?'<div class="note"><b class="'+(f.ok?'good':'bad')+'">'+(f.ok?'正确':'需要修正')+'</b><p>你的答案：'+esc(f.user)+'<br>正确答案：<b>'+esc(q.answer)+'</b></p><p>'+esc(f.why)+'</p></div><button id="next" class="primary">'+(quiz.i===quiz.questions.length-1?'查看结果':'下一题')+' ↵</button>':'<button id="check" class="primary">提交答案 ↵</button>' )+'</div>'}
function check(){let q=quiz.questions[quiz.i],user=el('answer').value.trim();if(!user)return;let ok=user.normalize('NFC').toLowerCase()===q.answer.normalize('NFC').toLowerCase();let why=q.kind==='number'?'数字听辨：正确的数字是 '+q.answer+'。':'主语 '+P[q.p]+' 决定人称，动词 '+q.v+' 的这一格是 '+q.answer+'。'+(G.find(g=>g[1]===q.v)?.[4]||'这是该动词的特殊变位，需要按词干与词尾记忆。');quiz.feedback={user,ok,why};quiz.results.push({...q,user,ok,why});if(!ok&&q.kind!=='number')db.wrong[q.v+'|'+q.p]=true;else if(ok)delete db.wrong[q.v+'|'+q.p];render()}
function summary(){let score=quiz.results.filter(x=>x.ok).length;return '<div class="card"><h2>本轮结果 · '+score+'/'+quiz.questions.length+'</h2><p>错误题号：'+(quiz.results.map((x,i)=>x.ok?'':i+1).filter(Boolean).join('、')||'无')+'</p>'+quiz.results.map((x,i)=>'<details><summary>'+(i+1)+'. '+(x.ok?'✓':'✗')+' '+x.v+'</summary><p>你的答案：'+esc(x.user)+'；正确答案：'+esc(x.answer)+'</p><p>'+esc(x.why)+'</p></details>').join('')+'<p><button class="primary" id="finish">记录结果并继续</button></p></div>'}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));if(el('numgo')){el('numgo').onclick=numshow;numshow()}if(el('numquiz'))el('numquiz').onclick=()=>start('number');if(el('group'))el('group').onchange=e=>{selected=+e.target.value;render()};if(el('groupquiz'))el('groupquiz').onclick=()=>start('group');if(el('mix'))el('mix').onclick=()=>start('mix');if(el('wrong'))el('wrong').onclick=()=>start('wrong');if(el('check'))el('check').onclick=check;if(el('next'))el('next').onclick=()=>{quiz.i++;quiz.feedback=null;render()};if(el('finish'))el('finish').onclick=()=>{db.history.push({date:new Date().toISOString(),results:quiz.results,});save();quiz=null;render()};if(el('answer'))el('answer').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();if(quiz.feedback){quiz.i++;quiz.feedback=null;render()}else check()}}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b)speak(b.dataset.say)});
render();
</script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pêche</title><style>
:root{--bg:#f7f1ee;--card:#ffffffa8;--ink:#222;--muted:#999;--green:#a7dcd0;--red:#f1b0ae;--yellow:#e4c575}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--ink);background:radial-gradient(circle at 88% 85%,#f4c8c2 0,transparent 35%),var(--bg);min-height:100vh}button{font:inherit;color:inherit}.app{min-height:100vh;padding:6vw}.home{text-align:center;margin-top:20vh}.home h1{font-size:64px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:24vh}.homebtn,.choice{border:0;border-radius:14px;background:var(--card);padding:23px;text-align:left}.homebtn b{font-size:24px}.count{display:block;color:#e47d43;font-size:20px;margin-top:5px}.study{max-width:760px;margin:8vh auto}.word{font-size:clamp(48px,8vw,76px);font-weight:800}.muted{color:var(--muted);margin-top:10px;display:flex;align-items:center;gap:9px}.sound{width:34px;height:34px;padding:0;border:1px solid rgba(255,255,255,.72);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.42);box-shadow:0 5px 16px rgba(93,65,57,.08),inset 0 1px 0 rgba(255,255,255,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);cursor:pointer;transition:transform .14s ease,background .14s ease,box-shadow .14s ease}.sound:hover{background:rgba(255,255,255,.68);box-shadow:0 7px 20px rgba(93,65,57,.11),inset 0 1px 0 rgba(255,255,255,.9)}.sound:active{transform:scale(.91)}.sound svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.7}.sound-label{width:auto;border-radius:999px;padding:0 13px;gap:7px;font-size:14px;color:#777}.choices{display:grid;gap:12px;margin-top:48px}.choice{font-size:20px}.choice.ok{background:var(--green)}.choice.no{background:var(--red)}.modal-backdrop{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(54,45,42,.18);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}.modal{width:min(430px,100%);background:rgba(255,250,248,.86);border:1px solid rgba(255,255,255,.82);border-radius:24px;padding:28px;box-shadow:0 22px 60px rgba(78,55,48,.18),inset 0 1px 0 rgba(255,255,255,.9);text-align:center}.modal-word{font-size:32px;font-weight:800;line-height:1.2}.modal-meaning{font-size:18px;margin:12px 0 22px;color:#666}.modal-sound{margin:0 auto 24px}.modal-ok{border:0;border-radius:999px;background:rgba(255,255,255,.72);box-shadow:0 5px 16px rgba(93,65,57,.08);padding:11px 28px;font-weight:700;cursor:pointer}.modal-ok:active{transform:scale(.97)}.row{display:flex;justify-content:space-between;margin-top:35vh}.act,.next{border:0;background:none;font-size:20px;font-weight:700;padding:12px 18px;border-bottom:4px solid #49aa9c}.red{border-color:#e45f55}.yellow{border-color:#d3a73e}.box{background:var(--card);border-radius:16px;padding:26px;margin-top:34px;font-size:22px}.next{display:block;margin:34px auto}.top{position:fixed;top:20px;left:24px;color:#777}.unit{font-size:13px;color:#aaa;margin-left:10px}@media(max-width:650px){.grid{grid-template-columns:1fr}.home{margin-top:15vh}.grid{margin-top:18vh}}</style></head><body><div id="app"></div><script src="vocab.js"></script><script>
const K="peche-v3",sh=a=>{a=[...a];for(let i=a.length-1;i;i--){let j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};let S=JSON.parse(localStorage.getItem(K)||"null")||{r:{},s:null};const sv=()=>localStorage.setItem(K,JSON.stringify(S)),sp=t=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";u.rate=.86;speechSynthesis.speak(u)},rec=f=>S.r[f]||{due:0,int:0};function home(){let l=Object.keys(S.r).length,d=VOCAB.filter(x=>S.r[x.f]&&rec(x.f).due<=Date.now()).length;app.innerHTML=`<div class=app><div class=home><h1>Pêche</h1><div class=grid><button class=homebtn onclick=learn()><b>Learn　L</b><span class=count>${VOCAB.length-l}</span></button><button class=homebtn onclick=review()><b>Review　R</b><span class=count>${d}</span></button></div></div></div>`}function learn(){if(S.s?.type==="l")return render();let p=sh(VOCAB.filter(x=>!S.r[x.f])).slice(0,20);if(!p.length)return alert("新词学完啦");S.s={type:"l",a:p.map(x=>({...x,m:0,q:0,e:0,p:"m",d:false})),cur:null,rev:false};sv();next()}const active=()=>S.s.a.filter(x=>!x.d);function next(){let a=active();if(!a.length)return finish();let x=sh(a)[0];S.s.cur=x.f;S.s.rev=false;sv();x.p==="m"?mcq(x):recall(x)}const soundIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6.8 8.5H4v7h2.8L11 19V5Z"/><path d="M15 9.2a4 4 0 0 1 0 5.6"/><path d="M17.8 6.5a7.6 7.6 0 0 1 0 11"/></svg>';function head(x){let d=S.s.a.filter(y=>y.d).length;return `<div class=top>${d}/${S.s.a.length}</div><div class=word>${x.f}<span class=unit>U${x.u}</span></div><div class=muted><button class=sound aria-label="播放发音" title="播放发音" onclick="sp('${x.f.replaceAll("'","\\'")}')">${soundIcon}</button><span>Tab 重播</span></div>`}function mcq(x){let o=sh([{z:x.z,f:x.f,ok:1},...sh(VOCAB.filter(y=>y.f!==x.f)).slice(0,3).map(y=>({z:y.z,f:y.f}))]);S.s.o=o;sv();app.innerHTML=`<div class=app><div class=study>${head(x)}<div class=choices>${o.map((y,i)=>`<button class=choice data-i=${i} onclick="pick(${i})">${i+1}.　${y.z}</button>`).join("")}</div></div></div>`;sp(x.f)}function wrongPopup(o){sp(o.f);let b=document.createElement("div");b.className="modal-backdrop";b.id="wrongModal";b.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="modal-word">${o.f}</div><div class="modal-meaning">${o.z}</div><button class="sound modal-sound" aria-label="重新播放发音" onclick="sp('${o.f.replaceAll("'","\\'")}')">${soundIcon}</button><br><button class="modal-ok" onclick="closeWrong()">确定</button></div>`;document.body.appendChild(b)}function closeWrong(){document.getElementById("wrongModal")?.remove()}function pick(i){let x=S.s.a.find(y=>y.f===S.s.cur),o=S.s.o[i],e=document.querySelector('[data-i="'+i+'"]');if(o.ok){e.classList.add("ok");x.m++;if(x.m>=2)x.p="q";sv();setTimeout(()=>reveal(x),250)}else{if(e.classList.contains("no")){wrongPopup(o);return}e.classList.add("no");x.m=0;sv();wrongPopup(o)}}function recall(x){app.innerHTML=`<div class=app><div class=study>${head(x)}<div class=row><button class=act onclick="rq(1)">认识 Q</button><button class="act red" onclick="rq(0)">不认识 E</button></div></div></div>`;sp(x.f)}function rq(ok){let x=S.s.a.find(y=>y.f===S.s.cur);if(ok){x.q++;x.e=0;if(x.q>=3)x.d=true}else{x.q=0;x.e++;if(x.e>=2){x.p="m";x.m=0;x.e=0}}sv();reveal(x)}function reveal(x){S.s.rev=true;sv();app.innerHTML=`<div class=app><div class=study>${head(x)}<div class=box><b>${x.z}</b><p><button class="sound sound-label" onclick="sp('${x.f.replaceAll("'","\\'")}')">${soundIcon}<span>播放单词</span></button></p></div><button class=next onclick=next()>下一词　Space</button></div></div>`;sp(x.f)}function finish(){let t=Date.now();S.s.a.forEach(x=>S.r[x.f]={due:t+864e5,int:1});S.s=null;sv();home()}function review(){let p=sh(VOCAB.filter(x=>S.r[x.f]&&rec(x.f).due<=Date.now()));if(!p.length)return alert("现在没有到期复习词");S.s={type:"r",a:p.map(x=>({...x,q:0,d:false})),cur:null,rev:false};sv();rn()}function rn(){let a=active();if(!a.length){S.s=null;sv();return home()}let x=sh(a)[0];S.s.cur=x.f;S.s.rev=false;sv();app.innerHTML=`<div class=app><div class=study>${head(x)}<div class=row><button class=act onclick="grade('g')">认识 Q</button><button class="act yellow" onclick="grade('h')">模糊 W</button><button class="act red" onclick="grade('a')">忘记 E</button></div></div></div>`;sp(x.f)}function grade(g){let x=S.s.a.find(y=>y.f===S.s.cur),r=rec(x.f);if(g==="g"){x.q++;if(x.q>=2){x.d=true;r.int=Math.max(1,Math.round((r.int||1)*2.2));r.due=Date.now()+r.int*864e5}}else if(g==="h"){x.q=0;r.int=Math.max(1,Math.round((r.int||1)*1.2));r.due=Date.now()+r.int*864e5}else{x.q=0;r.int=0;r.due=Date.now()+600000}S.r[x.f]=r;sv();S.s.rev=true;app.innerHTML=`<div class=app><div class=study>${head(x)}<div class=box><b>${x.z}</b></div><button class=next onclick=rn()>下一词　Space</button></div></div>`;sp(x.f)}function render(){if(!S.s)return home();let x=S.s.a.find(y=>y.f===S.s.cur)||active()[0];if(!x)return home();if(S.s.rev)return S.s.type==="l"?reveal(x):rn();S.s.type==="r"?rn():(x.p==="m"?mcq(x):recall(x))}document.addEventListener("keydown",e=>{let k=e.key.toLowerCase();if(e.key==="Tab"){e.preventDefault();let x=S.s?.a.find(y=>y.f===S.s.cur);if(x)sp(x.f);return}if(!S.s){if(k==="l")learn();if(k==="r")review();return}if(e.key===" "&&S.s.rev){e.preventDefault();S.s.type==="l"?next():rn();return}if(S.s.type==="l"&&!S.s.rev){let x=S.s.a.find(y=>y.f===S.s.cur);if(x.p==="m"&&/[1-4]/.test(e.key))pick(+e.key-1);if(x.p==="q"&&k==="q")rq(1);if(x.p==="q"&&k==="e")rq(0)}else if(S.s.type==="r"&&!S.s.rev){if(k==="q")grade("g");if(k==="w")grade("h");if(k==="e")grade("a")}});home();</script></body></html>

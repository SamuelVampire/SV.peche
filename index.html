(.97)}.row{display:flex;justify-content:space-between;margin-top:35vh}.act,.next{border:0;background:none;font-size:20px;font-weight:700;padding:12px 18px;border-bottom:4px solid #49aa9c}.red{border-color:#e45f55}.yellow{border-color:#d3a73e}.box{background:var(--card);border-radius:16px;padding:26px;margin-top:34px;font-size:22px}.next{display:block;margin:34px auto}.reveal-actions{display:flex;align-items:center;justify-content:space-between;margin-top:28px}.reveal-actions .next{margin:0}.mistake{border:0;background:none;font-size:17px;font-weight:700;padding:12px 18px;border-bottom:4px solid #e45f55;color:#777;cursor:pointer}.spellinput{width:100%;margin-top:46px;border:0;border-bottom:3px solid rgba(73,170,156,.5);background:transparent;padding:14px 4px;font:inherit;font-size:clamp(30px,6vw,52px);font-weight:750;outline:none;color:var(--ink)}.spellinput.bad{border-color:#e45f55}.spell-correct{margin-top:18px;font-size:25px;font-weight:800;color:#d9554c}.spell-hint{margin-top:9px;color:#999}.coursecards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:28px}.coursecard{border:0;border-radius:18px;background:var(--card);padding:24px;text-align:left;cursor:pointer}.coursecard b{display:block;font-size:24px}.coursecard span{display:block;color:#999;margin-top:8px}.coursecard.disabled{opacity:.48;cursor:default}.top{position:fixed;top:20px;left:24px;color:#777}.unit{font-size:13px;color:#aaa;margin-left:10px}.learnlights{display:flex;align-items:center;gap:4px;margin-top:13px;height:8px}.learnlights .dot{width:6px;height:6px;border-radius:50%;background:rgba(80,70,65,.12);box-shadow:inset 0 0 0 1px rgba(80,70,65,.05);transition:background .18s ease,box-shadow .18s ease,transform .18s ease}.learnlights .dot.on{background:rgba(228,125,67,.72);box-shadow:0 0 6px rgba(228,125,67,.22)}.learnlights .dot.recall.on{background:rgba(73,170,156,.76);box-shadow:0 0 6px rgba(73,170,156,.22)}.learnlights .gap{width:5px}@media(max-width:650px){.grid{grid-template-columns:1fr}.home{margin-top:15vh}.grid{margin-top:18vh}}.source-note{font-size:11px;font-weight:400;line-height:1.45;color:#b9aeb2;margin-top:8px;letter-spacing:.01em}.source-note::before{content:"AI  ";font-size:9px;opacity:.8}</style></head><body><div id="app"></div><script src="vocab.js"></script><script src="tcf_vocab.js"></script><script>
const K="peche-v3",wordKey=x=>(x?.id||x?.f),sh=a=>{a=[...a];for(let i=a.length-1;i;i--){let j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};let S=JSON.parse(localStorage.getItem(K)||"null")||{r:{},s:null};const sv=()=>localStorage.setItem(K,JSON.stringify(S)),sp=t=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";u.rate=.86;speechSynthesis.speak(u)},rec=f=>S.r[f]||{due:0,int:0};S.tr=S.tr||{};const crec=x=>S.course==="tcf"?(S.tr[wordKey(x)]||{due:0,int:0}):rec(x.f),markRec=(x,v)=>{if(S.course==="tcf")S.tr[wordKey(x)]=v;else S.r[x.f]=v},bank=()=>S.course==="tcf"?TCF_VOCAB:VOCAB;S.order=S.order||"random";function setOrder(v){if(S.order!==v&&S.s){S.s=null}S.order=v;sv();home()}S.course=S.course||"inspire";function selectCourse(){app.innerHTML=`<div class=app><div class=coursepanel><button class=back onclick=home()>← 返回</button><h2>选择课程词库</h2><div class=coursehint>Inspire 与 TCF 的学习记录完全独立保存。</div><div class=coursecards><button class=coursecard onclick="useCourse('inspire')"><b>Inspire</b><span>Inspire 1 · A1 · ${VOCAB.length} 条</span></button><button class=coursecard onclick="useCourse('tcf')"><b>TCF</b><span>A1–C1 · ${TCF_VOCAB.length} 条 · 按等级与主题</span></button></div></div></div>`}function useCourse(v){S.course=v;S.order="course";S.s=null;sv();home()}function home(){let B=bank(),R=S.course==="tcf"?S.tr:S.r,l=Object.keys(R).length,d=B.filter(x=>R[wordKey(x)]&&crec(x).due<=Date.now()).length,spc=B.filter(x=>R[wordKey(x)]).length;app.innerHTML=`<div class=app><div class=home><h1>Pêche</h1><div class=orderbox><div class=orderlabel>单词顺序</div><div class=seg><button class="${S.order==="random"?"on":""}" onclick="setOrder('random')">全部随机</button><button class="${S.order==="course"?"on":""}" onclick="selectCourse()">课程模式 · ${S.course==="inspire"?"Inspire":"TCF"}</button></div></div><div class=grid><button class=homebtn onclick=learn()><b>Learn　L</b><span class=count>${B.length-l}</span></button><button class=homebtn onclick=review()><b>Review　R</b><span class=count>${d}</span></button><button class=homebtn onclick=spelling()><b>Spelling　S</b><span class=count>${spc}</span></button></div></div></div>`}function groupKeys(){if(S.course==="tcf")return Object.keys(TCF_GROUPS);return Object.keys(GROUPS).sort((a,b)=>{let [au,ag]=a.split("-").map(Number),[bu,bg]=b.split("-").map(Number);return au-bu||ag-bg})}function groupName(k){if(S.course==="tcf"){let g=TCF_GROUPS[k];return `${g.level} · 第${g.group}组 · ${g.themes.join(" / ")}`}let g=GROUPS[k],ls=g.lessons,range=ls.length===1?`Leçon ${ls[0]}`:`Leçon ${ls[0]}–${ls[ls.length-1]}`;return `Unit ${g.unit} · ${range} · 第${g.group}组`}function groupWords(k){if(S.course==="tcf"){let g=TCF_GROUPS[k],all=TCF_VOCAB.filter(x=>x.level===g.level),start=(g.group-1)*25;return all.slice(start,start+25)}let g=GROUPS[k];return VOCAB.filter(x=>x.u===g.unit&&x.g===g.group)}function chooseGroup(type){let keys=groupKeys(),R=S.course==="tcf"?S.tr:S.r;app.innerHTML=`<div class=app><div class=coursepanel><button class=back onclick=home()>← 返回</button><h2>${S.course==="tcf"?"TCF "+(type==="l"?"学习":"复习"):(type==="l"?"按课程学习":"按课程复习")}</h2><div class=coursehint>${S.course==="tcf"?"按 CEFR 等级与主题排列，每组约 20–25 个词/表达。":"课程顺序固定，使用 7 词滚动窗口。"}</div><div class=groups>${keys.map(k=>{let words=groupWords(k),n=type==="l"?words.filter(x=>!R[wordKey(x)]).length:words.filter(x=>R[wordKey(x)]&&crec(x).due<=Date.now()).length,done=n===0;return `<button class="groupbtn ${done?"done":""}" ${done?"disabled":""} onclick="startGroup('${type}','${k}')"><b>${groupName(k)}</b><span>${type==="l"?n+" 个新词":n+" 个待复习"}</span></button>`}).join("")}</div></div></div>`}function makeLearnSession(p,mode,extra={}){let all=p.map(x=>({...x,m:0,q:0,e:0,p:"m",d:false}));return {type:"l",mode,...extra,a:all.slice(0,7),pending:all.slice(7),cur:null,rev:false,rot:0}}function refillLearn(){while(S.s?.type==="l"&&S.s.a.filter(x=>!x.d).length<7&&S.s.pending?.length)S.s.a.push(S.s.pending.shift())}function startGroup(type,k){let pool=groupWords(k),R=S.course==="tcf"?S.tr:S.r;if(type==="l"){let p=pool.filter(x=>!R[wordKey(x)]);if(!p.length)return chooseGroup("l");S.s=makeLearnSession(p,"course",{group:k});sv();next()}else{let p=sh(pool.filter(x=>R[wordKey(x)]&&crec(x).due<=Date.now()));if(!p.length)return chooseGroup("r");S.s={type:"r",mode:"course",group:k,a:p.map(x=>({...x,q:0,d:false})),cur:null,rev:false};sv();rn()}}function firstCourseGroup(type){let R=S.course==="tcf"?S.tr:S.r;for(const k of groupKeys()){let pool=groupWords(k),left=type==="l"?pool.filter(x=>!R[wordKey(x)]):pool.filter(x=>R[wordKey(x)]&&crec(x).due<=Date.now());if(left.length)return k}return null}function learn(){if(S.s?.type==="l"&&S.s.mode===S.order)return render();if(S.s?.type==="l"&&S.s.mode!==S.order){S.s=null;sv()}if(S.order==="course"){let k=firstCourseGroup("l");return k?startGroup("l",k):alert("新词学完啦")}let B=bank(),R=S.course==="tcf"?S.tr:S.r,p=sh(B.filter(x=>!R[wordKey(x)]));if(!p.length)return alert("新词学完啦");S.s=makeLearnSession(p,"random");sv();next()}const active=()=>S.s.a.filter(x=>!x.d);function next(){refillLearn();let a=active();if(!a.length)return finish();let last=S.s.cur,idx=(S.s.rot||0)%a.length,x=a[idx];if(a.length>1&&x.f===last)x=a[(idx+1)%a.length];S.s.rot=(a.indexOf(x)+1)%Math.max(1,a.length);S.s.cur=x.f;S.s.rev=false;sv();x.p==="m"?mcq(x):recall(x)}const soundIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6.8 8.5H4v7h2.8L11 19V5Z"/><path d="M15 9.2a4 4 0 0 1 0 5.6"/><path d="M17.8 6.5a7.6 7.6 0 0 1 0 11"/></svg>';function lights(x){if(S.s?.type!=="l")return"";let m=Math.min(2,x.m||0),q=Math.min(3,x.q||0);return `<div class=learnlights aria-label="学习进度"><i class="dot ${m>0?"on":""}"></i><i class="dot ${m>1?"on":""}"></i><i class=gap></i><i class="dot recall ${q>0?"on":""}"></i><i class="dot recall ${q>1?"on":""}"></i><i class="dot recall ${q>2?"on":""}"></i></div>`}function phonics(x){if(!x.pr)return"";return `<div class=phonics aria-label="拼写与音标对应">${x.pr.map(([s,p])=>`<span class=chunk><span class=letters>${s}</span><span class=ipa>/${p}/</span></span>`).join("")}</div>`}function sourceNote(x){return x?.source==="gpt"?'<div class="source-note">当前暂无专业词典中文释义 · GPT 翻译，仅供学习参考</div>':""}function head(x){let d=S.s.a.filter(y=>y.d).length,meta=x.level?`${x.level} · ${x.theme}`:`U${x.u} · L${x.l}`;return `<div class=top>${d}/${S.s.a.length}</div><div class=word>${x.f}<span class=unit>${meta}</span></div>${phonics(x)}${lights(x)}<div class=muted><button class=sound aria-label="播放发音" title="播放发音" onclick="sp('${x.f.replaceAll("'","\\'")}')">${soundIcon}</button><span>Tab 重播</span></div>`}function mcq(x){let o=sh([{z:x.z,f:x.f,ok:1},...sh(bank().filter(y=>y.f!==x.f)).slice(0,3).map(y=>({z:y.z,f:y.f}))]);S.s.o=o;sv();app.innerHTML=`<div class=app><div class=study>${head(x)}<div class=choices>${o.map((y,i)=>`<button class=choice data-i=${i} onclick="pick(${i})">${i+1}.　${y.z}</button>`).join("")}</div></div></div>`;sp(x.f)}function wrongPopup(o){sp(o.f);let b=document.createElement("div");b.className="modal-backdrop";b.id="wrongModal";b.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="modal-word">${o.f}</div><div class="modal-meaning">${o.z}</div>${sourceNote(o)}<button class="sound modal-sound" aria-label="重新播放发音" onclick="sp('${o.f.replaceAll("'","\\'")}')">${soundIcon}</button><br><button class="modal-ok" onclick="closeWrong()">确定</button></div>`;document.body.appendChild(b)}function closeWrong(){document.getElementById("wrongModal")?.remove()}function pick(i){let x=S.s.a.find(y=>y.f===S.s.cur),o=S.s.o[i],e=document.querySelector('[data-i="'+i+'"]');if(o.ok){e.classList.add("ok");x.m++;if(x.m>=2)x.p="q";sv();setTimeout(()=>reveal(x),250)}else{if(e.classList.contains("no")){wrongPopup(o);return}e.classList.add("no");x.m=0;sv();wrongPopup(o)}}function recall(x){app.innerHTML=`<div class=app><div class=study>${head(x)}<div class=row><button class=act onclick="rq(1)">认识 Q</button><button class="act red" onclick="rq(0)">不认识 E</button></div></div></div>`;sp(x.f)}function rq(ok){let x=S.s.a.find(y=>y.f===S.s.cur);if(ok){x.q++;x.e=0;if(x.q>=3)x.d=true}else{x.q=0;x.e++;if(x.e>=2){x.p="m";x.m=0;x.e=0}}sv();reveal(x)}function reveal(x){S.s.rev=true;sv();app.innerHTML=`<div class=app><div class=study>${head(x)}<div class=box><b>${x.z}</b>${sourceNote(x)}<p><button class="sound sound-label" onclick="sp('${x.f.replaceAll("'","\\'")}')">${soundIcon}<span>播放单词</span></button></p></div><div class=reveal-actions><button class=next onclick=next()>下一词　Space</button><button class=mistake onclick=undoLearnCorrect()>记错了　E</button></div></div></div>`;sp(x.f)}function undoLearnCorrect(){if(!S.s||S.s.type!=="l"||!S.s.rev)return;let x=S.s.a.find(y=>y.f===S.s.cur);if(!x)return;if(x.p==="q"){x.q=Math.max(0,(x.q||0)-1);x.d=false}else{x.m=Math.max(0,(x.m||0)-1)}S.s.rev=false;sv();next()}function finish(){let t=Date.now();S.s.a.forEach(x=>{if(x.d)markRec(x,{due:t+432e5,int:1})});S.s=null;sv();home()}function review(){if(S.s?.type==="r")return render();if(S.order==="course")return chooseGroup("r");let B=bank(),R=S.course==="tcf"?S.tr:S.r,p=sh(B.filter(x=>R[wordKey(x)]&&crec(x).due<=Date.now()));if(!p.length)return alert("现在没有到期复习词");S.s={type:"r",mode:"random",a:p.map(x=>({...x,q:0,d:false})),cur:null,rev:false};sv();rn()}function rn(){let a=active();if(!a.length){S.s=null;sv();return home()}let x=sh(a)[0];S.s.cur=x.f;S.s.rev=false;sv();app.innerHTML=`<div class=app><div class=study>${head(x)}<div class=row><button class=act onclick="grade('g')">认识 Q</button><button class="act yellow" onclick="grade('h')">模糊 W</button><button class="act red" onclick="grade('a')">忘记 E</button></div></div></div>`;sp(x.f)}function grade(g){let x=S.s.a.find(y=>y.f===S.s.cur),r=crec(x);if(g==="g"){x.q++;if(x.q>=2){x.d=true;r.int=Math.max(1,Math.round((r.int||1)*2.2));r.due=Date.now()+r.int*864e5}}else if(g==="h"){x.q=0;r.int=Math.max(1,Math.round((r.int||1)*1.2));r.due=Date.now()+r.int*864e5}else{x.q=0;r.int=0;r.due=Date.now()+600000}markRec(x,r);sv();S.s.rev=true;app.innerHTML=`<div class=app><div class=study>${head(x)}<div class=box><b>${x.z}</b></div><button class=next onclick=rn()>下一词　Space</button></div></div>`;sp(x.f)}function spelling(){if(S.s?.type==="s")return spellRender();let B=bank(),R=S.course==="tcf"?S.tr:S.r,p=sh(B.filter(x=>R[wordKey(x)]));if(!p.length)return alert("还没有进入复习状态的单词");S.s={type:"s",a:p.map(x=>({...x,spellMiss:0})),i:0,cur:null,rev:false,retry:[]};sv();spellNext()}function spellNext(){if(!S.s||S.s.type!=="s")return;let a=S.s.a;if(!a.length){S.s=null;sv();return home()}let x;if(S.s.retry?.length&&S.s.i>0&&S.s.i%4===0){let f=S.s.retry.shift();x=a.find(y=>y.f===f)}if(!x){x=a[S.s.i%a.length];S.s.i++}S.s.cur=x.f;S.s.rev=false;sv();spellQuestion(x)}function spellQuestion(x,msg=""){app.innerHTML=`<div class=app><div class=study><div class=top>Spelling</div><div class=muted><button class=sound aria-label="播放发音" onclick="sp('${x.f.replaceAll("'","\\'")}')">${soundIcon}</button><span>Tab 重播 · Enter 检查</span></div><input id=spellInput class="spellinput ${msg?"bad":""}" autocomplete=off autocapitalize=none spellcheck=false aria-label="输入听到的法语">${msg?`<div class=spell-correct>${x.f}</div><div class=spell-hint>拼错了。看一眼正确拼写，然后在原题重新完整拼对。</div>`:""}</div></div>`;setTimeout(()=>{let i=document.getElementById("spellInput");i?.focus();i?.addEventListener("input",()=>{document.querySelector(".spell-correct")?.remove();document.querySelector(".spell-hint")?.remove();i.classList.remove("bad")},{once:true})},0);sp(x.f)}function spellCheck(){let x=S.s?.a.find(y=>y.f===S.s.cur),inp=document.getElementById("spellInput");if(!x||!inp)return;let norm=s=>s.trim().replace(/\s+/g," ").toLocaleLowerCase("fr");if(norm(inp.value)===norm(x.f)){S.s.rev=true;if(x.spellMiss>0&&!S.s.retry.includes(x.f))S.s.retry.push(x.f);sv();spellAnswer(x)}else{x.spellMiss=(x.spellMiss||0)+1;S.s.rev=false;sv();spellQuestion(x,"bad")}}function spellAnswer(x){app.innerHTML=`<div class=app><div class=study><div class=top>Spelling ✓</div>${head(x)}<div class=box><b>${x.z}</b><p><button class="sound sound-label" onclick="sp('${x.f.replaceAll("'","\\'")}')">${soundIcon}<span>播放单词</span></button></p></div><button class=next onclick=spellNext()>继续　Space</button></div></div>`;sp(x.f)}function spellRender(){let x=S.s.a.find(y=>y.f===S.s.cur)||S.s.a[0];if(!x)return home();S.s.rev?spellAnswer(x):spellQuestion(x)}function render(){if(!S.s)return home();if(S.s.type==="s")return spellRender();let x=S.s.a.find(y=>y.f===S.s.cur)||active()[0];if(!x)return home();if(S.s.rev)return S.s.type==="l"?reveal(x):rn();S.s.type==="r"?rn():(x.p==="m"?mcq(x):recall(x))}document.addEventListener("keydown",e=>{let k=e.key.toLowerCase();if(e.key==="Tab"){e.preventDefault();let x=S.s?.a.find(y=>y.f===S.s.cur);if(x)sp(x.f);return}if(!S.s){if(k==="l")learn();if(k==="r")review();if(k==="s")spelling();return}if(S.s.type==="s"){if(e.key==="Enter"&&!S.s.rev){e.preventDefault();spellCheck();return}if(e.key===" "&&S.s.rev){e.preventDefault();spellNext();return}return}if(e.key===" "&&S.s.rev){e.preventDefault();S.s.type==="l"?next():rn();return}if(S.s?.type==="l"&&S.s.rev&&k==="e"){e.preventDefault();undoLearnCorrect();return}if(S.s.type==="l"&&!S.s.rev){let x=S.s.a.find(y=>y.f===S.s.cur);if(x.p==="m"&&/[1-4]/.test(e.key))pick(+e.key-1);if(x.p==="q"&&k==="q")rq(1);if(x.p==="q"&&k==="e")rq(0)}else if(S.s.type==="r"&&!S.s.rev){if(k==="q")grade("g");if(k==="w")grade("h");if(k==="e")grade("a")}});home();</script></body></html>
